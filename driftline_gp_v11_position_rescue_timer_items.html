function updateProjectiles(dt){

function processKartCollision(a,b){

  else if(aw<bw){applyCollisionPush(a,-nx,-ny,b,1.15);b.speed*=.96;}
  else{applyCollisionPush(a,-nx,-ny,b,.55);applyCollisionPush(b,nx,ny,a,.55);a.speed*=.92;b.speed*=.92;}
}
function applyCollisionPush(victim,nx,ny,source,forceMultiplier){

  victim.knockbackX=nx*force*120; victim.knockbackY=ny*force*120; victim.knockbackTimer=.20;

  else if(ss.weightClass>vs.weightClass){victim.status='knockback';hitKart(victim,'BUMP',source);}
  else {victim.damageCooldown=.25;victim.invuln=.25;}
}
function solveCollisions(dt){

  game.lostCoins.forEach(c=>{c.ttl-=dt;c.age+=dt;c.x+=c.vx*dt;c.y+=c.vy*dt;c.z+=c.vz*dt;c.vz-=5.8*dt;c.spin+=dt*11;if(c.z<0){c.z=0;c.vz*=-.35;c.vx*=.55;c.vy*=.55;}});game.lostCoins=game.lostCoins.filter(c=>c.ttl>0);game.itemFlash=Math.max(0,game.itemFlash-dt);
}
function updateProjectiles(dt){}
function hitObstacles(r){}
function spawnCpuHazard(type,cpu,player,track){if(type==='WAVE_PUSH'){useShrinkWave(cpu,game);return;} if(type==='SEEKER_POD'){fireSeeker(cpu,game);return;} if(type==='SPARK_SHOT'||type==='BOUNCE_FIRE'||type==='TRICK_SHELL'){fireBouncer(cpu,game);return;} dropHazardBehindKart(cpu,game);}
function randomItem(r){const pos=r.place||r.position||4;let table=ITEM_TABLES.MID;if(pos<=2)table=ITEM_TABLES.FRONT;else if(pos>=6)table=ITEM_TABLES.BACK;return weightedPick(table);}
function itemShort(name){return {BOOST:'BST',SEEKER:'SEK',BOUNCER:'BNC',DROPPER:'DRP',AURA:'AUR',SHRINK_WAVE:'WAV',VAULT:'VLT'}[name]||'---';}
function itemColor(name){return {BOOST:'#ffd45a',SEEKER:'#ff5454',BOUNCER:'#6dff72',DROPPER:'#ffe56b',AURA:'#fff3a0',SHRINK_WAVE:'#9fb0ff',VAULT:'#b8f3ff'}[name]||'#aab3d4';}
function renderBillboards(tr,cam){
  const things=[];
  for(const b of tr.itemBoxes){if(!b.active)continue;const p=project(cam,b.x,b.y,0);if(p)things.push({type:'item',p,obj:b});}
  for(const c0 of tr.coinPickups){if(!c0.active)continue;const p=project(cam,c0.x,c0.y,0);if(p)things.push({type:'coin',p,obj:c0});}
  for(const obj of game.objectPool){if(!obj.active)continue;const p=project(cam,obj.x,obj.y,0);if(p)things.push({type:'obj',p,obj});}
  for(const c of game.lostCoins){const p=project(cam,c.x,c.y,c.z);if(p)things.push({type:'lostcoin',p,obj:c});}
  for(const r of game.racers){if(r.player)continue;const p=project(cam,r.x,r.y,r.z);if(p)things.push({type:'racer',p,obj:r});}
  things.sort((a,b)=>b.p.depth-a.p.depth);
  for(const t of things){if(t.type==='item')drawItemPad(t.p.x,t.p.y,t.p.scale,t.obj.spin);else if(t.type==='coin')drawCoin(t.p.x,t.p.y,t.p.scale,t.obj.spin);else if(t.type==='lostcoin')drawCoin(t.p.x,t.p.y,t.p.scale,t.obj.spin);else if(t.type==='obj')drawObjectBillboard(t.obj,t.p);else if(t.type==='racer')drawRival(t.obj,t.p);}
  for(const p of game.particles)drawParticleBillboard(p,cam);
}
function drawObjectBillboard(obj,p){if(obj.type===OBJECT_TYPES.DROPPER)drawDropper(p.x,p.y,p.scale,obj);else drawSpark(p.x,p.y,p.scale,obj.type===OBJECT_TYPES.SEEKER?'SEEKER':'BOUNCER');}
function finishRace(){if(game.finished)return;game.finished=true;game.mode='race_finish_freeze';game.inputLocked=true;game.raceEndTimer=1.35;game.messages.push({text:'FINISH!',t:1.1});for(const r of game.racers){r.inputLocked=true;r.itemCd=999;r.drifting=false;if(!r.finishTime)r.finishTime=game.time+Math.max(0,8-(r.position||r.place||8))*.21;}prepareResultRows(true);}
function fmtTime(t){if(game&&game.raceTimer)return formatRaceTimer({minutes:Math.floor(t/60),seconds:Math.floor(t%60),frames:Math.floor((t%1)*60),totalFrames:Math.floor(t*60)});const m=Math.floor(t/60),s=Math.floor(t%60),ms=Math.floor((t*100)%100);return m+':'+String(s).padStart(2,'0')+'.'+String(ms).padStart(2,'0');}
function bindInput(){
  input=makeInput();
  window.addEventListener('keydown',e=>{if(!input)return;input.keys[e.key.toLowerCase()]=true;if(e.key===' '){input.item=true;input.itemPressed=true;input.itemQueued=true;e.preventDefault();}if(e.key==='Shift'||e.key.toLowerCase()==='x'){input.jump=true;input.jumpPressed=true;e.preventDefault();}if(e.key.toLowerCase()==='z'||e.key.toLowerCase()==='c'||e.key==='Control'){input.drift=true;input.driftPressed=true;e.preventDefault();}});
  window.addEventListener('keyup',e=>{if(!input)return;input.keys[e.key.toLowerCase()]=false;if(e.key===' ')input.item=false;if(e.key==='Shift'||e.key.toLowerCase()==='x')input.jump=false;if(e.key.toLowerCase()==='z'||e.key.toLowerCase()==='c'||e.key==='Control')input.drift=false;});
  const ptrPos=e=>({x:e.clientX,y:e.clientY});
  stick.addEventListener('pointerdown',e=>{if(!input)return;stick.setPointerCapture(e.pointerId);input.stickId=e.pointerId;const r=stick.getBoundingClientRect();input.stickCenter={x:r.left+r.width/2,y:r.top+r.height/2};handleStick(e);e.preventDefault();});
  stick.addEventListener('pointermove',e=>{if(input&&input.stickId===e.pointerId){handleStick(e);e.preventDefault();}});
  const endStick=e=>{if(input&&input.stickId===e.pointerId){input.stickId=null;input.touch.steer=0;input.touch.gas=false;input.touch.brake=false;input.steer=0;knob.style.transform='translate(0,0)';}};
  stick.addEventListener('pointerup',endStick);stick.addEventListener('pointercancel',endStick);
  function handleStick(e){const p=ptrPos(e),c=input.stickCenter;const dx=p.x-c.x,dy=p.y-c.y;const max=42;const len=Math.hypot(dx,dy)||1;const nx=dx/Math.max(len,max)*Math.min(len,max);const ny=dy/Math.max(len,max)*Math.min(len,max);knob.style.transform='translate('+nx+'px,'+ny+'px)';input.touch.steer=clamp(dx/max,-1,1);input.touch.gas=dy<22;input.touch.brake=dy>32;}
  bindButton(btnGas,'gas'); bindButton(btnItem,'item'); bindButton(btnDrift,'drift'); bindButton(btnJump,'jump');
  function bindButton(elm,name){
    elm.addEventListener('pointerdown',e=>{if(!input)return;elm.setPointerCapture(e.pointerId);input.touch[name]=true; input[name]=true; if(name==='item'){input.itemPressed=true;input.itemQueued=true;}if(name==='jump')input.jumpPressed=true;if(name==='drift')input.driftPressed=true;elm.classList.add('down');e.preventDefault();});
    const up=e=>{if(!input)return;input.touch[name]=false; input[name]=false;elm.classList.remove('down');e.preventDefault();};
    elm.addEventListener('pointerup',up);elm.addEventListener('pointercancel',up);elm.addEventListener('pointerleave',e=>{if(e.buttons===0)up(e);});
  }
}
function pollKeyboard(){if(!input)return;const k=input.keys;const left=k.arrowleft||k.a, right=k.arrowright||k.d, up=k.arrowup||k.w, down=k.arrowdown||k.s;const keySteer=(left?-1:0)+(right?1:0);input.steer=input.stickId!==null?input.touch.steer:keySteer;input.gas=!!(input.touch.gas||up);input.brake=!!input.touch.brake||!!down;input.item=!!input.touch.item;input.jump=!!input.touch.jump;input.drift=!!(input.touch.drift||k.z||k.c||k.control);}
function frame(now){let dt=Math.min((now-last)/1000,.05);last=now; pollKeyboard(); update(dt); render(); requestAnimationFrame(frame);}

function boot(){buildAllTracks();bindInput();renderTitle();requestAnimationFrame(frame);}
boot();
})();
