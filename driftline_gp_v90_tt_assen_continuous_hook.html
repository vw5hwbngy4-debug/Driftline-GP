  let best=null,bestScore=1e18;
  for(const r of raceState.racers){
    if(!seekerValidTargetV22(owner,r))continue;
    const dx=r.x-owner.x, dy=r.y-owner.y, d2=dx*dx+dy*dy;
    if(d2<1||d2>SEEKER_CONFIG_V22.forwardAcquireDist*SEEKER_CONFIG_V22.forwardAcquireDist)continue;
    const d=Math.sqrt(d2), dot=(dx*fx+dy*fy)/d;
    if(dot<SEEKER_CONFIG_V22.forwardConeCos)continue;
    const score=d*(1.35-dot);
    if(score<bestScore){bestScore=score;best=r;}
  }
  return best;
}
function findTargetAhead(owner,raceState){
  const cone=findTargetInFrontConeV22(owner,raceState);
  if(cone)return cone;
  if(!owner||!raceState?.racers)return null;
  const ownerProgress=seekerProgressOfV22(owner);
  const candidates=[];
  for(const r of raceState.racers){
    if(!seekerValidTargetV22(owner,r))continue;
    let delta=seekerProgressOfV22(r)-ownerProgress;
    if(delta<0)delta+=100000*lapsToRun;
    if(delta>4)candidates.push({r,delta,d2:squaredDistance(owner.x,owner.y,r.x,r.y)});
  }
  candidates.sort((a,b)=>a.delta-b.delta||a.d2-b.d2);
  if(candidates.length)return candidates[0].r;
  const fallback=[];
  for(const r of raceState.racers){
    if(!seekerValidTargetV22(owner,r))continue;
    fallback.push({r,d2:squaredDistance(owner.x,owner.y,r.x,r.y)});
  }
  fallback.sort((a,b)=>a.d2-b.d2);
  return fallback[0]?.r||null;
}
function fireSeeker(kart,raceState){

  const distToTarget=target ? (Math.abs(target.x-kart.x)+Math.abs(target.y-kart.y)) : 99999;
  const mode=target && distToTarget<SEEKER_CONFIG_V22.lockManhattan ? 'HOMING' : 'NODE_FOLLOW';
  return spawnObject(OBJECT_TYPES.SEEKER,{
    ownerId:kart.id,
    targetId:target?target.id:null,
    bridgeZone:kart.bridgeZone??0,
    x:kart.x+c*SEEKER_CONFIG_V22.spawnDistance,
    y:kart.y+s*SEEKER_CONFIG_V22.spawnDistance,
    vx:c*SEEKER_CONFIG_V22.speed,
    vy:s*SEEKER_CONFIG_V22.speed,

    speed:SEEKER_CONFIG_V22.speed,
    life:SEEKER_CONFIG_V22.life,

    mode,

    radius:SEEKER_CONFIG_V22.radiusX,
    radiusX:mode==='HOMING'?SEEKER_CONFIG_V22.homingRadiusX:SEEKER_CONFIG_V22.radiusX,
    radiusY:mode==='HOMING'?SEEKER_CONFIG_V22.homingRadiusY:SEEKER_CONFIG_V22.radiusY,
    graceTimer:SEEKER_CONFIG_V22.ownerGrace,

}
function isTargetInsideSeekerLockRadius(obj,target){
  if(!obj||!target)return false;
  const man=Math.abs(target.x-obj.x)+Math.abs(target.y-obj.y);
  if(man<SEEKER_CONFIG_V22.lockManhattan)return true;
  const dotTarget=(()=>{
    const dx=target.x-obj.x, dy=target.y-obj.y, d=Math.hypot(dx,dy)||1;
    return (dx*safeCosV17(obj.angle||0)+dy*safeSinV17(obj.angle||0))/d;
  })();

}
function updateSeekerNodeFollow(obj,raceState,dt){
  const track=raceState.track, node=track.nodes?.[obj.nodeIndex||0];
  if(!node){despawnObject(obj);return;}
  const desired=angleTo(obj.x,obj.y,node.x,node.y);
  obj.angle=lerpAngle(obj.angle,desired,SEEKER_CONFIG_V22.nodeTurnRate*dt);
  obj.vx=safeCosV17(obj.angle)*obj.speed;
  obj.vy=safeSinV17(obj.angle)*obj.speed;
  if(squaredDistance(obj.x,obj.y,node.x,node.y)<SEEKER_CONFIG_V22.nodeReachRadius*SEEKER_CONFIG_V22.nodeReachRadius){

}
function updateSeekerHoming(obj,target,raceState,dt){
  const lead=Math.min(.22,Math.max(.06,(Math.abs(target.x-obj.x)+Math.abs(target.y-obj.y))/4200));
  const tx=target.x+safeCosV17(target.moveAngle??target.faceAngle??target.angle??0)*(target.speed||0)*lead;
  const ty=target.y+safeSinV17(target.moveAngle??target.faceAngle??target.angle??0)*(target.speed||0)*lead;
  const desired=angleTo(obj.x,obj.y,tx,ty);
  const man=Math.abs(target.x-obj.x)+Math.abs(target.y-obj.y);
  const turn=man<SEEKER_CONFIG_V22.closeManhattan?SEEKER_CONFIG_V22.closeHomingTurnRate:SEEKER_CONFIG_V22.homingTurnRate;
  obj.angle=lerpAngle(obj.angle,desired,turn*dt);
  obj.speed=Math.max(obj.speed||0,SEEKER_CONFIG_V22.speed);
  obj.vx=safeCosV17(obj.angle)*obj.speed;
  obj.vy=safeSinV17(obj.angle)*obj.speed;
  obj.radiusX=SEEKER_CONFIG_V22.homingRadiusX;
  obj.radiusY=SEEKER_CONFIG_V22.homingRadiusY;
}
function updateSeekerWithoutTarget(obj,raceState,dt){
  obj.retargetTimer=(obj.retargetTimer||0)-dt;
  if(obj.retargetTimer<=0){
    obj.retargetTimer=SEEKER_CONFIG_V22.retargetTime;
    const owner=getRacerById(raceState,obj.ownerId);
    const t=owner?findTargetAhead(owner,raceState):null;
    if(t){obj.targetId=t.id;obj.mode='HOMING';obj.state='homing';updateSeekerHoming(obj,t,raceState,dt);return;}
  }
  obj.mode='NODE_FOLLOW';obj.state='node';obj.radiusX=SEEKER_CONFIG_V22.radiusX;obj.radiusY=SEEKER_CONFIG_V22.radiusY;
  updateSeekerNodeFollow(obj,raceState,dt);
}
function updateSeeker(obj,raceState,dt){
  let target=getRacerById(raceState,obj.targetId);
  const owner=getRacerById(raceState,obj.ownerId);
  if(!target||target.finished||String(target.status||'').startsWith('rescue')||((obj.bridgeZone??0)!==(target.bridgeZone??0))){
    const fresh=owner?findTargetAhead(owner,raceState):null;
    if(fresh){obj.targetId=fresh.id;target=fresh;}
  }
  if(!target||target.finished||String(target.status||'').startsWith('rescue')||((obj.bridgeZone??0)!==(target.bridgeZone??0))){
    updateSeekerWithoutTarget(obj,raceState,dt);
  }else if(isTargetInsideSeekerLockRadius(obj,target)||obj.mode==='HOMING'){
    obj.mode='HOMING';obj.state='homing';
    updateSeekerHoming(obj,target,raceState,dt);
  }else{
    obj.mode='NODE_FOLLOW';obj.state='node';obj.radiusX=SEEKER_CONFIG_V22.radiusX;obj.radiusY=SEEKER_CONFIG_V22.radiusY;
    updateSeekerNodeFollow(obj,raceState,dt);
  }
  obj.x+=obj.vx*dt;obj.y+=obj.vy*dt;
  // In HOMING mode, do not instantly vanish on a soft track edge; give it a chance to finish the attack.
  const wall=sampleWallCollision(raceState.track,obj.x,obj.y);
  if(wall && obj.mode!=='HOMING'){
    spawnPoof(obj.x,obj.y,raceState);despawnObject(obj);return;
  }
  if(wall && obj.mode==='HOMING'){
    obj.life-=dt*.8;
    obj.x-=obj.vx*dt*.35; obj.y-=obj.vy*dt*.35;
  }
}


/* === V23 GHOST VOID RESCUE + COUNTDOWN KART STOPLIGHT ===
   Fixes rescue hanging in black/void by forcing a valid centerline safe node
   and snapping to target if carry takes too long. Also adds visual start-light. */
function isRescueSafeSurfaceV23(surface){
  return !(surface===SURFACE.VOID||surface===SURFACE.GAP||surface===SURFACE.LAVA||surface===SURFACE.DEEP||surface===SURFACE.DEEP_WATER);
}
function findRescueTargetV23(kart,track){
  const nodes=track.nodes||[];

  if(kart.lastSafeNodeIndex!==undefined)guesses.push(kart.lastSafeNodeIndex);
  if(kart.currentNodeIndex!==undefined)guesses.push(kart.currentNodeIndex);
  if(kart.nextNodeIndex!==undefined)guesses.push((kart.nextNodeIndex-1+nodes.length)%nodes.length);
  if(kart.lastSafeS!==undefined)guesses.push(nearestNodeIndex(track,kart.lastSafeS));
  if(kart.s!==undefined)guesses.push(nearestNodeIndex(track,kart.s));
  const base=guesses.length?guesses[0]:0;
  for(let pass=0;pass<2;pass++){
    const source=pass===0?guesses:[base];
    for(const start of source){
      if(!nodes.length)break;
      for(let step=0;step<nodes.length;step++){
        const idx=(start-step+nodes.length)%nodes.length;
        const n=nodes[idx];
        if(!n)continue;
        const surf=sampleSurface(track,n.x,n.y);
        if(isRescueSafeSurfaceV23(surf)){
          return {x:n.x,y:n.y,angle:n.angle??pointAt(track,n.s||0,0).angle,index:idx,s:n.s??0,surface:surf,bridgeZone:n.bridgeZone??0};
        }

  const p=pointAt(track,near.s||0,0);
  return {x:p.x,y:p.y,angle:p.angle,index:nearestNodeIndex(track,p.s||near.s||0),s:p.s||near.s||0,surface:SURFACE.ROAD,bridgeZone:0};

  const oldLap=kart.lap??-1;
  const oldNode=kart.currentNodeIndex??0;
  updateProgressBaseV26(kart);
  const newS=Number.isFinite(kart.s)?kart.s:nearestOnTrack(track,kart.x,kart.y).s;
  const nodeCount=(track.nodes&&track.nodes.length)||40;

  const wasNearEnd=oldNode>nodeCount*.58 || (kart.checkpoint||0)>nodeCount*.58 || (kart.raceProgressScore||0)>((oldLap+1)*100000+nodeCount*.58*1000);

    kart.lap=(kart.lap??-1)+1;

    squaredDistance(cpu.x, cpu.y, player.x, player.y) <
    radius * radius;

  const surface=sampleSurface(track,cpu.x,cpu.y);

  const targetNode = getCpuTargetNode(cpu, track, raceState);
  const desiredAngle = angleTo(cpu.x, cpu.y, targetNode.x, targetNode.y);

    cpu.faceAngle,
    desiredAngle,
    (cpu.aiTurnRate||3.0) * cc.cpuTurnRateMultiplier * dt

    cpu.moveAngle,
    cpu.faceAngle,
    0.96 * cc.cpuTurnRateMultiplier * dt

/* === V32 CPU ITEM FAIRNESS + STRONGER RIVAL RUBBERBAND ===
   CPU can only use item pressure after crossing an item-box gate.
   Each racer can take each item gate once per lap. 50cc/100cc rubberband
   pressure is raised, while still avoiding teleporting. */
function tuneCcPressureV32(){
  if(typeof CC_CLASSES==='undefined')return;
  Object.assign(CC_CLASSES["50cc"],{
    cpuSpeedMultiplier:1.02,
    cpuAccelerationMultiplier:1.02,
    cpuNodeError:.95,
    cpuTurnRateMultiplier:.98,
    cpuAttackCooldownMultiplier:1.25,
    rubberScale:40000,
    rubberMin:.82,
    rubberMax:1.22,
    rubberAggression:1.08
  });
  Object.assign(CC_CLASSES["100cc"],{
    cpuSpeedMultiplier:1.24,
    cpuAccelerationMultiplier:1.14,
    cpuNodeError:.42,
    cpuTurnRateMultiplier:1.14,
    cpuAttackCooldownMultiplier:.82,
    rubberScale:34000,
    rubberMin:.74,
    rubberMax:1.34,
    rubberAggression:1.30
  });
  Object.assign(CC_CLASSES["150cc"],{
    cpuSpeedMultiplier:1.44,
    cpuAccelerationMultiplier:1.26,
    cpuNodeError:.04,
    cpuTurnRateMultiplier:1.34,
    cpuAttackCooldownMultiplier:.45,
    rubberScale:28000,
    rubberMin:.64,
    rubberMax:1.52,
    rubberAggression:1.55
  });
}
tuneCcPressureV32();
function itemGateKeyV32(track,box){
  const frac=box.gate!==undefined?box.gate:(box.s||0)/(track.len||1);
  return 'L'+Math.max(0,Math.floor(game?.time>=0?(0):0))+'G'+Math.round(frac*1000);
}
function racerLapKeyV32(r){
  return Math.max(0,r.lap||0);
}
function hasUsedItemGateThisLapV32(r,box,track){
  const lap=racerLapKeyV32(r);
  const key=String(Math.round(((box.gate!==undefined?box.gate:(box.s||0)/(track.len||1)))*1000));
  r.itemGateLapsV32=r.itemGateLapsV32||{};
  return r.itemGateLapsV32[key]===lap;
}
function markItemGateUsedV32(r,box,track){
  const lap=racerLapKeyV32(r);
  const key=String(Math.round(((box.gate!==undefined?box.gate:(box.s||0)/(track.len||1)))*1000));
  r.itemGateLapsV32=r.itemGateLapsV32||{};
  r.itemGateLapsV32[key]=lap;
}
function pickItem(r){
  if(!game||!game.track||!game.track.itemBoxes)return;
  if(r.player&&(game.currentItem||game.roulette))return;
  if(!r.player&&r.item)return;
  for(const box of game.track.itemBoxes){
    if(!box.active)continue;
    if((box.bridgeZone??0)!==(r.bridgeZone??0))continue;
    if(hasUsedItemGateThisLapV32(r,box,game.track))continue;
    if(dist2(r.x,r.y,box.x,box.y)<46*46){
      box.active=false;
      box.respawn=8.5;
      markItemGateUsedV32(r,box,game.track);
      const it=randomItem(r);
      if(r.player){
        beginItemRoulette(it);
      }else{
        r.item=it;
        r.cpuItemFromBox=true;
        r.cpuItemCharge=1;
        r.cpuItemUseDelay=.45+Math.random()*.55;
        r.itemBoxHits=(r.itemBoxHits||0)+1;
      }
      break;
    }
  }
}
function cpuItemAllowedV32(cpu){
  return !!(cpu.item&&cpu.cpuItemFromBox&&(cpu.cpuItemCharge||0)>0);
}
function cpuShouldUseItemV32(cpu,player,raceState){
  if(!cpuItemAllowedV32(cpu))return false;
  cpu.cpuItemUseDelay=Math.max(0,(cpu.cpuItemUseDelay||0)-1/60);
  if(cpu.cpuItemUseDelay>0)return false;
  const d2=squaredDistance(cpu.x,cpu.y,player.x,player.y);
  const pos=cpu.position||cpu.place||8;
  const item=String(cpu.item||'').toUpperCase();
  let delta=(player.raceProgressScore??player.totalProgress??getRaceProgress(player))-(cpu.raceProgressScore??cpu.totalProgress??getRaceProgress(cpu));
  if(delta<0)delta+=100000*lapsToRun;

/* === V33 REVERSE DETECTION FIX ===

   Reverse now requires sustained negative track progress AND opposite movement direction. */
function signedTrackDeltaV33(prevS,nextS,len){
  let d=(nextS??0)-(prevS??0);
  if(d>len*.5)d-=len;
  if(d<-len*.5)d+=len;

  const near=nearestOnTrack(track,kart.x,kart.y);

  const p=game.racers&&game.racers[0];
  if(!p||p.finished||String(p.status||'').startsWith('rescue'))return false;
  if((p.speed||0)<38){
    p.reverseWarningTimerV33=0;
    p.reverseLastS_V33=Number.isFinite(p.s)?p.s:nearestOnTrack(game.track,p.x,p.y).s;
    p.reverseLastTimeV33=game.elapsed||0;
    return false;
  }
  const now=game.elapsed||0;
  const dt=clamp(now-(p.reverseLastTimeV33??now),0,0.08);
  p.reverseLastTimeV33=now;
  const currentS=Number.isFinite(p.s)?p.s:nearestOnTrack(game.track,p.x,p.y).s;
  if(p.reverseLastS_V33===undefined)p.reverseLastS_V33=currentS;
  const ds=signedTrackDeltaV33(p.reverseLastS_V33,currentS,game.track.len||1);
  p.reverseLastS_V33=currentS;

  const roadA=trackForwardAngleAtKartV33(p,game.track);
  const moveA=p.moveAngle??p.faceAngle??p.angle??0;
  const angleDiff=Math.abs(angleWrap(moveA-roadA));
  const actuallyMovingBackward=ds<-2.0;
  const clearlyFacingBackward=angleDiff>2.35;

  // Both must be true for a sustained period. This avoids false warnings on corners,
  // drifts, node transitions, and local nearest-segment glitches.
  if(actuallyMovingBackward && clearlyFacingBackward){
    p.reverseWarningTimerV33=(p.reverseWarningTimerV33||0)+dt;
  }else if(ds>1.0 || angleDiff<1.85){
    p.reverseWarningTimerV33=Math.max(0,(p.reverseWarningTimerV33||0)-dt*3.0);

  kart.lap=0;
  kart.checkpoint=0;
  kart.s=near.s;
  kart._lapLastS_V37=near.s;
  kart._lapSectorsV37=0;
  kart._lapCrossCooldownFramesV37=95;
  kart._lapLastCrossFrameV37=-99999;
  kart._v37PreStart=near.s>len*.52;
  kart._v37IgnoreStartCross=kart._v37PreStart;
  kart._v37LapInit=true;
  updateKartNodeProgress(kart,track);
  kart.raceProgressScore=(kart._v37PreStart?-(kart.startSlot||0)*90:0)+(kart.nodeProgress||0);
  kart.totalProgress=kart.raceProgressScore;
}
function lapDisplayV37(kart){
  return clamp(kart?.completedLapsV37??0,0,lapsToRun);
}
function resetLapSectorsV37(kart){
  kart._lapSectorsV37=0;
  kart.checkpoint=0;
  kart._lapCrossCooldownFramesV37=95;
}
function updateLapSectorsV37(kart,newS,len,ds){
  if(kart._v37PreStart)return;
  if(ds<-6)return;
  const p=newS/len;
  if(p>.18){kart._lapSectorsV37|=1;kart.checkpoint=Math.max(kart.checkpoint||0,1);}
  if(p>.40){kart._lapSectorsV37|=2;kart.checkpoint=Math.max(kart.checkpoint||0,2);}
  if(p>.62){kart._lapSectorsV37|=4;kart.checkpoint=Math.max(kart.checkpoint||0,3);}
  if(p>.82){kart._lapSectorsV37|=8;kart.checkpoint=Math.max(kart.checkpoint||0,4);}
}
function validLapCrossV37(kart,track,prevS,newS,ds){
  const len=track.len||1;
  const frame=game?.frameCount||0;
  const crossedForward=prevS>len*.68 && newS<len*.32 && ds>0;
  if(!crossedForward)return false;
  if((kart._lapCrossCooldownFramesV37||0)>0)return false;
  if(frame-(kart._lapLastCrossFrameV37||0)<105)return false;

  // Grid starts just behind the finish. This first forward crossing begins lap 0/3;
  // it is NOT a completed lap.
  if(kart._v37PreStart||kart._v37IgnoreStartCross){
    kart._v37PreStart=false;
    kart._v37IgnoreStartCross=false;
    kart._lapLastCrossFrameV37=frame;
    kart._lapLastS_V37=newS;
    resetLapSectorsV37(kart);
    return false;
  }

  // Require the full course sectors since the last crossing.
  // This prevents spin/projectile jitter near the line from adding multiple laps.
  const sectors=(kart._lapSectorsV37||0);
  return (sectors&15)===15;
}
function updateRaceProgress(kart,track){
  if(!kart||!track)return;
  if(!kart._v37LapInit)initLapStateV37(kart,track);
  updateKartNodeProgress(kart,track);
  const completed=lapDisplayV37(kart);
  if(kart._v37PreStart){
    kart.raceProgressScore=-(kart.startSlot||0)*90+(kart.nodeProgress||0);
  }else{
    kart.raceProgressScore=completed*100000+(kart.currentNodeIndex||0)*1000+(kart.nodeProgress||0)*999;
  }
  kart.totalProgress=kart.raceProgressScore;
  kart.completedLapsV36=completed;
  kart.displayLap=completed;
  kart.lap=completed;
}
function updateProgress(kart){
  if(!kart||kart.finished||!game||!game.track)return;
  const track=game.track,len=track.len||1;
  if(!kart._v37LapInit)initLapStateV37(kart,track);
  const frame=game.frameCount||0;
  if(kart._lastProgressFrameV37===frame){updateRaceProgress(kart,track);return;}
  kart._lastProgressFrameV37=frame;

  const near=nearestOnTrack(track,kart.x,kart.y);
  const prevS=Number.isFinite(kart._lapLastS_V37)?kart._lapLastS_V37:(Number.isFinite(kart.s)?kart.s:near.s);
  const newS=near.s;
  const ds=signedTrackDeltaV37(prevS,newS,len);
  kart._lapLastS_V37=newS;
  kart.s=newS;
  if((kart._lapCrossCooldownFramesV37||0)>0)kart._lapCrossCooldownFramesV37--;

  updateKartNodeProgress(kart,track);
  updateLapSectorsV37(kart,newS,len,ds);

  if(validLapCrossV37(kart,track,prevS,newS,ds)){
    const completed=lapDisplayV37(kart);
    kart._lapLastCrossFrameV37=frame;
    if(completed>=lapsToRun){
      finishKart(kart);
      return;
    }
    const nextCompleted=completed+1;
    kart.completedLapsV37=nextCompleted;
    kart.completedLapsV36=nextCompleted;
    kart.displayLap=nextCompleted;
    kart.lap=nextCompleted;
    kart.currentNodeIndex=0;kart.nodeIndex=0;kart.nextNodeIndex=1;
    kart.lastSafeNodeIndex=0;kart.lastSafeS=0;kart.s=0;
    resetLapSectorsV37(kart);
    if(kart.player){
      game.messages.push({text:'LAP '+nextCompleted+'/'+lapsToRun,t:.85});
      if(nextCompleted===lapsToRun&&!game.finalLapShown){
        game.finalLapShown=true;
        game.messages.push({text:'FINAL LAP',t:1.45});
      }
    }
  }
  updateRaceProgress(kart,track);
}

/* === V39 ITEM BOX GATES + CLEAN SNES-STYLE HUD ===
   Procedural canvas-only upgrade: no external/generated images.
   Adds proper raised item boxes on the track and replaces stacked HUD layers with one clean race overlay. */
function laneOffsetsForItemGateV39(track,frac){
  const half=(typeof getRoadHalfWidthAtV18==='function'?getRoadHalfWidthAtV18(track,wrap(frac,1)*track.len):track.width*.5);
  const spread=Math.min(Math.max(half*.56,52),92);
  return [-spread,-spread*.33,spread*.33,spread];
}
function itemGateIsUnsafeV39(track,frac){
  if(typeof zoneAtV18!=='function'||typeof SURFACE==='undefined')return false;
  const s=wrap(frac,1)*track.len;
  const dangerKeys=['GAP','DEEP_WATER','LAVA','VOID'];
  for(const k of dangerKeys){ if(SURFACE[k]&&zoneAtV18(track,s,SURFACE[k]))return true; }
  return !!zoneAtV18(track,s,'danger_under_bridge');
}
function itemGateExistsNearV39(track,frac){
  return (track.itemBoxes||[]).some(b=>{
    const bf=(b.gate!==undefined?b.gate:(b.s||0)/(track.len||1));
    let d=Math.abs(wrap(bf-frac+.5,1)-.5);
    return d<.045;
  });
}
function addItemGateV39(track,frac,label){
  frac=wrap(frac,1);
  if(itemGateIsUnsafeV39(track,frac))return;
  if(itemGateExistsNearV39(track,frac))return;
  const s0=track.len*frac;
  const bridgeZone=(typeof zoneAtV18==='function'&&typeof SURFACE!=='undefined'&&SURFACE.BRIDGE&&zoneAtV18(track,s0,SURFACE.BRIDGE))?1:0;
  let startSpin=(track.itemBoxes||[]).length;
  for(const off of laneOffsetsForItemGateV39(track,frac)){
    const p=pointAt(track,s0,off);
    track.itemBoxes.push({x:p.x,y:p.y,s:s0,off,active:true,respawn:0,spin:startSpin++,gate:frac,bridgeZone,style:'v39_box',label:label||'?' });
  }
}
function enhanceItemBoxesV39(track){
  // Short/simple tracks get a second gate; long/technical tracks get a third gate.
  const plan=(track.len>7600||track.diff>=4)?[.44,.82]:[.68];
  for(const f of plan)addItemGateV39(track,(f+(track.index%4)*.006)%1,'?');
}

generateTrackObjects=function(track){
  generateTrackObjectsBaseV39(track);

function drawItemBoxV39(x,y,s,spin=0){
  const scale=clamp(s,0.18,1.65);
  const size=clamp(28*scale,8,30);
  const bob=Math.sin((game?game.elapsed:0)*5.5+spin)*Math.max(1,scale*2);

  ctx.save();

  ctx.beginPath();ctx.ellipse(0,size*.34+bob,size*.62,size*.18,0,0,TAU);ctx.fill();
  ctx.translate(0,-size*.55);
  ctx.transform(1,0,skew,1,0,0);

    rr.appendChild(pcCellV46(ordinal(row.pos)));
    const rider=pcCellV46(row.name,'');
    if(row.player)rider.innerHTML=(row.name||'')+'<span class="pcYouV46">YOU</span>';

    if(active)add.innerHTML='+'+(ctxState.displayedAdded[row.name]||0)+' <span class="ping">+1</span>';

function renderAnimatedResultsCountV46(startCounting=true){
  injectPointCountStylesV46();
  clearPointsTimerV45();
  state='results'; if(game)game.mode='results_counting'; showMenu();menu.innerHTML='';menu.classList.add('point-count-v46');prepareResultRows(true);
  const previous={...(game.previousStandings||{})};
  if(!Object.keys(previous).length){for(const r of game.resultRows)previous[r.name]=0;}
  const current={...previous};
  const displayedAdded={};
  game.resultRows.forEach(row=>{displayedAdded[row.name]=0;if(current[row.name]===undefined)current[row.name]=0;});
  const finishRows=game.resultRows.slice().sort((a,b)=>a.pos-b.pos);
  const startRows=startOrderRowsV43(game.resultRows,previous);
  const awardRows=finishRows.filter(r=>r.pts>0).sort((a,b)=>b.pos-a.pos);
  let awardIndex=0;
  const ctxState={stage:'start',activeName:'',previous,current,displayedAdded};

  const s=el('div','screen pointCountScreenV46');

  const controls=el('div','pcActionsV46');
  s.appendChild(controls);
  menu.appendChild(s);

  function finalSort(){
    return game.resultRows.slice().sort((a,b)=>((current[b.name]||0)-(current[a.name]||0)) || a.pos-b.pos || resultStartRankV43(a)-resultStartRankV43(b) || (a.rosterIndex||0)-(b.rosterIndex||0));
  }
  function setHint(text){
    controls.innerHTML='';
    const hint=el('div','pcCountingHintV46',text);
    controls.appendChild(hint);
  }
  function draw(rows,mode){

  }
  function showStart(){
    ctxState.stage='start';ctxState.activeName='';title.textContent='START POSITION';draw(startRows,'start');setHint('COUNTING...');
  }
  function showCounting(){
    ctxState.stage='count';title.textContent='ADDING POINTS';draw(startRows,'count');setHint('COUNTING...');
  }
  function showRefresh(){
    ctxState.stage='refresh';ctxState.activeName='';title.textContent='REFRESHING...';draw(startRows,'refresh');setHint('UPDATING TABLE...');
  }
  function showFinal(){
    ctxState.stage='final';ctxState.activeName='';title.textContent='UPDATED STANDINGS';
    const sorted=finalSort();draw(sorted,'final');
    cupStandings={...current};game.pointsApplied=true;game.displayOrder=sorted.map(r=>r.name);game.mode='race_results_done';
    controls.innerHTML='';
    const cupTracks=tracksForCupV45(selectedCup);
    if(gpMode&&cupRaceIndex<cupTracks.length-1){
      const n=el('button','alt','NEXT RACE');
      n.onclick=()=>{clearPointsTimerV45();cupRaceIndex++;selectedTrack=cupTracks[cupRaceIndex].index;renderNextRace();};
      controls.appendChild(n);
    }else if(gpMode){
      const cr=el('button','alt','CUP CEREMONY');
      cr.onclick=()=>{clearPointsTimerV45();renderCupResults();};
      controls.appendChild(cr);
    }else{
      const done=el('button','alt','CONTINUE');done.onclick=renderTitle;controls.appendChild(done);
    }
  }
  function queue(ms,fn){clearPointsTimerV45();pointsTimer=setTimeout(fn,ms);}
  function tickAward(){
    clearPointsTimerV45();
    if(awardIndex>=awardRows.length){showCounting();queue(520,()=>{showRefresh();queue(620,showFinal);});return;}
    const row=awardRows[awardIndex];ctxState.activeName=row.name;
    if((displayedAdded[row.name]||0)<row.pts){
      displayedAdded[row.name]=(displayedAdded[row.name]||0)+1;
      current[row.name]=(current[row.name]||0)+1;
      showCounting();queue(125,tickAward);
    }else{awardIndex++;queue(220,tickAward);}
  }
  showStart();
  if(startCounting)queue(720,tickAward);
}

/* === V53 HIDDEN -1 START-LINE LAP STATE ===
   The start grid sits just before the finish line. Because the sector thresholds are cumulative,
   the very first grid crossing can look like a completed lap. We keep an internal -1 state:
   first finish crossing normalizes to visible 0/3, then real laps advance 1/3, 2/3, 3/3,

function lapRawV53(kart){

  if(typeof lapDisplayV51==='function')return lapDisplayV51(kart);
  if(typeof lapDisplayV50==='function')return lapDisplayV50(kart);

  kart.completedLapsV37=0;
  kart.completedLapsV36=0;
  kart.displayLap=0;
  kart.lap=0;
  kart.s=near.s;

  kart.nodeIndex=nodeIdx;
  kart.nextNodeIndex=(nodeIdx+1)%nodeCount;
  kart.checkpoint=0;

  kart._lapLastNode_V50=nodeIdx;
  kart._lapSectorsV50=0;
  kart._lapCrossCooldownFramesV50=0;
  kart._lastProgressFrameV50=-1;
  kart._v50LapInit=true;

      kart.lastSafeNodeIndex=0;kart.lastSafeS=0;

    const allowLeft=!!(sectionWide&&curveSafe&&isTrackPointSafeForCpuLaneV55(track,lp.x,lp.y));
    const allowRight=!!(sectionWide&&curveSafe&&isTrackPointSafeForCpuLaneV55(track,rp.x,rp.y));
    main.push({x:node.x,y:node.y,s:node.s,angle:node.angle,index:i,bridgeZone:node.bridgeZone??0,pathId:AI_PATH_V55.MAIN});
    left.push({x:allowLeft?lp.x:node.x,y:allowLeft?lp.y:node.y,s:node.s,angle:node.angle,index:i,bridgeZone:node.bridgeZone??0,pathId:AI_PATH_V55.LEFT_OVERTAKE,collapsed:!allowLeft});
    right.push({x:allowRight?rp.x:node.x,y:allowRight?rp.y:node.y,s:node.s,angle:node.angle,index:i,bridgeZone:node.bridgeZone??0,pathId:AI_PATH_V55.RIGHT_OVERTAKE,collapsed:!allowRight});

const buildAllTracksBaseV55=buildAllTracks;

function getOvertakeZoneForNodeV55(track,nodeIndex){
  if(!track||!track.overtakeZones||!track.overtakeZones.length)return null;
  const n=track.nodes?.length||32;
  const idx=((nodeIndex%n)+n)%n;
  for(const z of track.overtakeZones){
    const a=((z.fromNode%n)+n)%n,b=((z.toNode%n)+n)%n;
    if(a<=b){if(idx>=a&&idx<=b)return z;}
    else if(idx>=a||idx<=b)return z;
  }
  return null;
}
function getRacerByIdV55(raceState,id){return (raceState?.racers||[]).find(r=>r&&r.id===id)||null;}
function getRivalRoleV55(cpu,player){
  const data=RIVAL_MATRIX_V55[player?.id];
  if(!data||!cpu)return 'normal';
  if(data.primary===cpu.id)return 'primary';
  if(data.secondary===cpu.id)return 'secondary';
  return 'normal';
}
function getRivalOvertakeBonusV55(cpu,player,raceState){
  const role=getRivalRoleV55(cpu,player);
  if(role==='primary')return .12;
  if(role==='secondary')return .06;
  return 0;
}
function getRivalCooldownMultiplierV55(cpu,player){
  const role=getRivalRoleV55(cpu,player);
  if(role==='primary')return .55;
  if(role==='secondary')return .78;
  return 1;
}
function getCpuOvertakeChanceV55(cpu,raceState){
  const ccName=(raceState&&raceState.ccClass)||selectedCcClass||'50cc';
  const role=getRivalRoleV55(cpu,raceState?.player||raceState?.racers?.[0]);
  let chance=.35;
  if(ccName==='50cc')chance*=.55;
  else if(ccName==='150cc')chance*=1.35;
  if(role==='primary')chance*=1.75;
  else if(role==='secondary')chance*=1.25;
  return clamp(chance,.05,.92);
}
function findRacerDirectlyAheadV55(cpu,raceState){
  if(!cpu||!raceState||!raceState.racers)return null;
  const cpuProgress=(cpu.raceProgressScore??cpu.totalProgress??getRaceProgress(cpu));
  const maxD=(OVERTAKE_CONFIG_V55.proximityDistance*150);
  const maxD2=maxD*maxD;
  const candidates=[];
  for(const r of raceState.racers){
    if(!r||r.id===cpu.id||r.finished)continue;
    if(String(r.status||'').startsWith('rescue')||r.inputLocked)continue;
    if(getBridgeZoneV55(r)!==getBridgeZoneV55(cpu))continue;
    const progress=(r.raceProgressScore??r.totalProgress??getRaceProgress(r));
    let delta=progress-cpuProgress;
    if(delta<0&&Math.abs(delta)>50000)delta+=100000*(lapsToRun+1);
    if(delta<=0||delta>OVERTAKE_CONFIG_V55.progressWindow)continue;
    const d2=squaredDistance(cpu.x,cpu.y,r.x,r.y);
    if(d2>maxD2)continue;
    candidates.push({r,delta,d2});
  }
  candidates.sort((a,b)=>a.delta-b.delta||a.d2-b.d2);
  return candidates[0]?.r||null;
}
function chooseOvertakePathV55(cpu,track,raceState){
  const nodeIndex=cpu.currentNodeIndex??cpu.nodeIndex??nearestNodeIndex(track,cpu.s||0);
  const zone=getOvertakeZoneForNodeV55(track,nodeIndex);
  if(!zone)return AI_PATH_V55.MAIN;
  if((zone.safeBridgeZone??0)!==getBridgeZoneV55(cpu))return AI_PATH_V55.MAIN;
  const seed=(raceState.frameCount||0)+racerNumericIdV55(cpu)*31+nodeIndex*17;
  const preferLeft=(seed&1)===1;
  if(preferLeft&&zone.allowLeft)return AI_PATH_V55.LEFT_OVERTAKE;
  if(!preferLeft&&zone.allowRight)return AI_PATH_V55.RIGHT_OVERTAKE;
  if(zone.allowLeft)return AI_PATH_V55.LEFT_OVERTAKE;
  if(zone.allowRight)return AI_PATH_V55.RIGHT_OVERTAKE;
  return AI_PATH_V55.MAIN;
}
function maybeStartCpuOvertakeV55(cpu,raceState,dt){
  if(!cpu||cpu.player||cpu.overtakeActive)return;
  if(cpu.finished||cpu.inputLocked)return;
  if(String(cpu.status||'').startsWith('rescue'))return;
  if(cpu.status==='spin'||cpu.status==='flatten'||cpu.stun>0||cpu.spinTimer>0)return;
  cpu.overtakeCooldownV55=Math.max(0,(cpu.overtakeCooldownV55??cpu.overtakeCooldown??(1.0+hashUnitV55(racerNumericIdV55(cpu))*2.2))-dt);
  cpu.overtakeCooldown=cpu.overtakeCooldownV55;
  if(cpu.overtakeCooldownV55>0)return;
  const ahead=findRacerDirectlyAheadV55(cpu,raceState);
  if(!ahead)return;
  const chance=getCpuOvertakeChanceV55(cpu,raceState);
  const roll=hashUnitV55((raceState.frameCount||0)*.37+racerNumericIdV55(cpu)*43+(cpu.currentNodeIndex||0)*19);
  if(roll>chance){
    cpu.overtakeCooldownV55=.65+hashUnitV55((raceState.frameCount||0)+racerNumericIdV55(cpu))*1.15;
    cpu.overtakeCooldown=cpu.overtakeCooldownV55;
    return;
  }
  const pathId=chooseOvertakePathV55(cpu,raceState.track,raceState);
  if(pathId===AI_PATH_V55.MAIN)return;
  cpu.overtakeActive=true;
  cpu.aiPathId=pathId;
  cpu.overtakeTargetId=ahead.id;
  cpu.overtakeTimer=OVERTAKE_CONFIG_V55.maxDuration*(.82+hashUnitV55((raceState.frameCount||0)+racerNumericIdV55(cpu)*7)*.36);
  cpu.overtakeMinTimer=OVERTAKE_CONFIG_V55.minDuration;
  cpu.overtakeBoostTimer=cpu.overtakeTimer;
  cpu.overtakeCooldownV55=0;
  cpu._overtakeStartedNodeV55=cpu.currentNodeIndex??cpu.nodeIndex??0;
}
function isOvertakePathSafeV55(cpu,track){
  if(!cpu||!track)return false;
  const pathId=cpu.aiPathId??AI_PATH_V55.MAIN;
  if(pathId===AI_PATH_V55.MAIN)return true;
  const nodeIndex=cpu.currentNodeIndex??cpu.nodeIndex??nearestNodeIndex(track,cpu.s||0);
  const zone=getOvertakeZoneForNodeV55(track,nodeIndex);
  if(!zone)return false;
  if(pathId===AI_PATH_V55.LEFT_OVERTAKE&&!zone.allowLeft)return false;
  if(pathId===AI_PATH_V55.RIGHT_OVERTAKE&&!zone.allowRight)return false;
  if((zone.safeBridgeZone??0)!==getBridgeZoneV55(cpu))return false;
  const offset=pathOffsetForIdV55(track,pathId);
  const p=pointAt(track,(cpu.s||0)+Math.min(cpu.lookAhead||220,260),offset);
  return isTrackPointSafeForCpuLaneV55(track,p.x,p.y);
}
function endCpuOvertakeV55(cpu,raceState){
  if(!cpu)return;
  cpu.overtakeActive=false;
  cpu.aiPathId=AI_PATH_V55.MAIN;
  cpu.overtakeTargetId=null;
  cpu.overtakeBoostTimer=0;
  const player=raceState?.player||raceState?.racers?.find(r=>r.player)||raceState?.racers?.[0];
  const rivalMult=getRivalCooldownMultiplierV55(cpu,player);
  const ccName=(raceState&&raceState.ccClass)||selectedCcClass||'50cc';
  const ccMult=ccName==='50cc'?1.55:ccName==='150cc'?.72:1.0;
  cpu.overtakeCooldownV55=OVERTAKE_CONFIG_V55.cooldownBase*rivalMult*ccMult*(.75+hashUnitV55((raceState?.frameCount||0)+racerNumericIdV55(cpu)*13)*.5);
  cpu.overtakeCooldown=cpu.overtakeCooldownV55;
}
function updateCpuOvertakeStateV55(cpu,raceState,dt){
  if(!cpu||!cpu.overtakeActive)return;
  cpu.overtakeTimer-=dt;
  cpu.overtakeMinTimer=Math.max(0,(cpu.overtakeMinTimer||0)-dt);
  cpu.overtakeBoostTimer=Math.max(0,(cpu.overtakeBoostTimer||0)-dt);
  const target=getRacerByIdV55(raceState,cpu.overtakeTargetId);
  const unsafe=!isOvertakePathSafeV55(cpu,raceState.track);
  let passedTarget=false;
  if(target){
    const progressDelta=(cpu.raceProgressScore??cpu.totalProgress??getRaceProgress(cpu))-(target.raceProgressScore??target.totalProgress??getRaceProgress(target));
    passedTarget=progressDelta>OVERTAKE_CONFIG_V55.mergeAheadDistance;
  }
  if(cpu.status==='spin'||cpu.status==='flatten'||cpu.stun>0||cpu.spinTimer>0||cpu.inputLocked||String(cpu.status||'').startsWith('rescue')){
    endCpuOvertakeV55(cpu,raceState);return;
  }
  const canEnd=(cpu.overtakeMinTimer||0)<=0&&(passedTarget||(cpu.overtakeTimer||0)<=0||unsafe||!target);
  if(canEnd)endCpuOvertakeV55(cpu,raceState);
}
function getCpuOvertakeMultiplierV55(cpu,raceState){
  if(!cpu?.overtakeActive)return 1;
  const cc=getCcConfigV28(raceState);
  const ccName=(raceState&&raceState.ccClass)||selectedCcClass||'50cc';
  const player=raceState?.player||raceState?.racers?.find(r=>r.player)||raceState?.racers?.[0];
  let mult=OVERTAKE_CONFIG_V55.speedMultiplierBase;
  mult+=getRivalOvertakeBonusV55(cpu,player,raceState);
  if(ccName==='150cc')mult+=OVERTAKE_CONFIG_V55.speedMultiplier150ccBonus;
  if(ccName==='50cc')mult-=.04;
  mult*=clamp(cc.rubberAggression??1,.85,1.25);
  return clamp(mult,1,OVERTAKE_CONFIG_V55.maxOvertakeSpeedMultiplier);
}
getCpuTargetSpeed=function(cpu,player,raceState){
  const cc=getCcConfigV28(raceState);
  const stats=cpu.stats||cpu;
  const rubber=getCpuRubberbandMultiplier(cpu,player,raceState);
  const personality=cpu.speedPersonality??cpu.aiMood?.pace??1;
  let targetSpeed=stats.max*cc.cpuSpeedMultiplier*rubber*personality;
  targetSpeed*=getCpuOvertakeMultiplierV55(cpu,raceState);

getCpuTargetNode=function(cpu,track,raceState){
  const cc=getCcConfigV28(raceState);
  const near=nearestOnTrack(track,cpu.x,cpu.y);

  const desiredPath=(cpu.aiPathId??AI_PATH_V55.MAIN);
  const safePath=isOvertakePathSafeV55(cpu,track)?desiredPath:AI_PATH_V55.MAIN;
  const targetOffset=pathOffsetForIdV55(track,safePath);
  const mergeRate=cpu.overtakeActive?(raceState?.ccClass==='150cc'?5.0:4.0):3.0;
  cpu.aiLaneOffsetV55=lerp(cpu.aiLaneOffsetV55||0,targetOffset,clamp((raceState?.dt||1/60)*mergeRate,0,1));

  const idx=nearestNodeIndex(track,lookS);
  const path=track.aiPaths?.[safePath]||track.aiPaths?.[AI_PATH_V55.MAIN]||track.nodes;
  const node=path?.[idx]||track.nodes?.[idx%track.nodes.length];
  const smooth=pointAt(track,lookS,cpu.aiLaneOffsetV55||0);
  const baseX=Number.isFinite(node?.x)?lerp(smooth.x,node.x,.18):smooth.x;
  const baseY=Number.isFinite(node?.y)?lerp(smooth.y,node.y,.18):smooth.y;

  return {x:baseX+Math.cos(errorAngle)*errorAmount,y:baseY+Math.sin(errorAngle)*errorAmount,angle:smooth.angle,s:lookS,bridgeZone:node?.bridgeZone??getBridgeZoneV55(cpu)};
};
const updateCpuKartBaseV55=updateCpuKart;

    t.itemBoxes=[]; t.coinPickups=[]; t.obstacles=[];

    const addCoinAtFrac=(frac,off)=>{
      const p=pointAt(t,t.len*wrap01V62(frac),off);
      const near=nearestOnTrack(t,p.x,p.y);
      t.coinPickups.push({x:p.x,y:p.y,s:near.s,off,active:true,spin:(t.coinPickups.length*0.53)%TAU,bridgeZone:0});
    };
    const addRoadBox=(frac,off)=>{
      const p=pointAt(t,t.len*wrap01V62(frac),off);
      const near=nearestOnTrack(t,p.x,p.y);
      t.itemBoxes.push({x:p.x,y:p.y,s:near.s,off,active:true,respawn:0,spin:t.itemBoxes.length,gate:near.s/t.len,bridgeZone:0});
    };

    // Single item gate, zig-zagged, on the long top straight and well away from the finish line.
    [[0.128,-26],[0.143,14],[0.158,-12],[0.173,20],[0.188,-4]].forEach(v=>addRoadBox(v[0],v[1]));

    // Coins tuned to guide the racing line instead of random clusters.
    [
      // top straight approach / commit to speed
      [0.070,-10],[0.082,0],[0.094,10],
      // top-right sweep toward the finish side
      [0.225,-14],[0.238,0],[0.251,14],
      // left drop line
      [0.365,-8],[0.382,0],[0.399,8],
      // central S-entry / apex hint
      [0.550,-10],[0.565,0],[0.580,10],
      // lower exit straight / recovery
      [0.760,-12],[0.775,0],[0.790,12]
    ].forEach(v=>addCoinAtFrac(v[0],v[1]));
  };

  generateTrackMaps = function(t){
    if(t.index!==0) return baseGenerateTrackMapsV62(t);
    baseGenerateTrackMapsV62(t);
    // Add a little extra curb emphasis on the most meaningful corners for track 1.
    const g=t.mapCanvas.getContext('2d');
    const curbSections=[[0.278,0.322],[0.512,0.553],[0.596,0.646],[0.812,0.856],[0.938,0.978]];
    curbSections.forEach(fr=>{ drawTrackSectionV18(g,t,fr[0],fr[1],16,'#ffffff',1); drawTrackSectionV18(g,t,fr[0],fr[1],8,'#d92f2f',1); });
    // Repaint item boxes / coins above curbs so the map remains crisp.
    const sc=MAP/WORLD;
    for(const it of t.itemBoxes){ g.save(); g.translate(it.x*sc,it.y*sc); g.fillStyle='#f29b18'; g.fillRect(-6,-6,12,12); g.fillStyle='#140f07'; g.fillRect(-3,-3,6,6); g.fillStyle='#ffe17a'; g.fillRect(-1,-1,2,2); g.restore(); }
    for(const c0 of t.coinPickups){ g.save(); g.translate(c0.x*sc,c0.y*sc); g.fillStyle='#ffd400'; g.beginPath(); g.arc(0,0,3.2,0,TAU); g.fill(); g.restore(); }
    const tx=t.thumb.getContext('2d'); tx.clearRect(0,0,t.thumb.width,t.thumb.height); tx.drawImage(t.mapCanvas,0,0,t.thumb.width,t.thumb.height); tx.strokeStyle='rgba(255,255,255,.65)'; tx.lineWidth=3; tx.strokeRect(1,1,t.thumb.width-2,t.thumb.height-2);
    t.gfxData=g.getImageData(0,0,MAP,MAP).data;
  };

  function applyMasterTrack1AiV62(){
    const t=(typeof tracks!=='undefined'&&tracks&&tracks[0])?tracks[0]:null;
    if(!t||!t.nodes||!t.nodes.length) return;
    const lane=Math.max(34,Math.min(64,(t.width||232)*0.22));
    const main=[],left=[],right=[];
    const zones=[];
    const customZones=[
      {start:0.06,end:0.22,allowLeft:true,allowRight:true},   // top straight + fast sweep
      {start:0.34,end:0.42,allowLeft:true,allowRight:false},  // left descent
      {start:0.72,end:0.80,allowLeft:false,allowRight:true}   // lower recovery straight
    ];
    function zoneForFrac(fr){ return customZones.find(z=>fracInRangeV62(fr,z.start,z.end))||null; }
    for(let i=0;i<t.nodes.length;i++){
      const node=t.nodes[i];
      const fr=node.s/t.len;
      const zone=zoneForFrac(fr);
      const allowLeft=!!zone?.allowLeft;
      const allowRight=!!zone?.allowRight;
      const lp=pointAt(t,node.s,-lane);
      const rp=pointAt(t,node.s,lane);
      main.push({x:node.x,y:node.y,s:node.s,angle:node.angle,index:i,bridgeZone:node.bridgeZone??0,pathId:0});
      left.push({x:allowLeft?lp.x:node.x,y:allowLeft?lp.y:node.y,s:node.s,angle:node.angle,index:i,bridgeZone:node.bridgeZone??0,pathId:1,collapsed:!allowLeft});
      right.push({x:allowRight?rp.x:node.x,y:allowRight?rp.y:node.y,s:node.s,angle:node.angle,index:i,bridgeZone:node.bridgeZone??0,pathId:2,collapsed:!allowRight});
      if(zone) zones.push({fromNode:i,toNode:i,allowLeft,allowRight,safeBridgeZone:0});
    }
    t.aiPaths={0:main,1:left,2:right};
    t.overtakeZones=zones;
    t.overtakeLaneWidthV55=lane;
  }

  const baseTrackFlavorV62 = trackFlavor;
  trackFlavor = function(t){
    if(t&&t.index===0) return 'mastered opener: handmade counter-clockwise circuit with guided coin rhythm, one zig-zag item gate, crisp corner bumpers and custom CPU overtake lanes';
    return baseTrackFlavorV62(t);
  };

  buildAllTracks = function(){
    baseBuildAllTracksV62();
    applyMasterTrack1AiV62();
  };
  buildAllTracks.applyMasterTrack1AiV62=applyMasterTrack1AiV62;

  /* V84: rebuild deferred until the final patched track pipeline is ready. */
})();

  const TRACK1_ASSETS_V66 = {};

  }
  function whenReadyV66(fn){
    const fire = ()=>{ if(TRACK1_READY_V66) return; if(assetsReadyV66()){ TRACK1_READY_V66=true; fn(); } };
    for(const k of TRACK1_KEYS_V66){

/* === V68 TRACK 1 WALL COLLISION + PASTEL SKY === */
(function(){
  const TRACK1_WALL_SCALE_V68 = WORLD;
  const TRACK1_OUTER_WALL_V68 = 44;
  const TRACK1_INNER_WALL_V68 = 42;
  const TRACK1_OBS_RECTS_V68 = [
    {x:WORLD*0.760, y:WORLD*0.000, w:WORLD*0.240, h:WORLD*0.112},
    {x:WORLD*0.000, y:WORLD*0.780, w:WORLD*0.180, h:WORLD*0.220},
    {x:WORLD*0.515, y:WORLD*0.615, w:WORLD*0.160, h:WORLD*0.165},
    {x:WORLD*0.255, y:WORLD*0.205, w:WORLD*(0.740-0.255), h:WORLD*(0.495-0.205)},

  ];

  function rectWallHitV68(x,y,r,thick){
    if(x < r.x-thick || x > r.x+r.w+thick || y < r.y-thick || y > r.y+r.h+thick) return null;
    const dl = Math.abs(x-r.x), dr = Math.abs(x-(r.x+r.w)), dt = Math.abs(y-r.y), db = Math.abs(y-(r.y+r.h));

    if(m===dr) return {normalX: 1, normalY:0, pushX:(r.x+r.w+thick)-x, pushY:0};
    if(m===dt) return {normalX:0, normalY:-1, pushX:0, pushY:(r.y-thick)-y};

  function track1WallHitV68(x,y){

    if(x>WORLD-TRACK1_OUTER_WALL_V68) return {normalX:-1, normalY:0, pushX:(WORLD-TRACK1_OUTER_WALL_V68)-x, pushY:0};
    if(y<TRACK1_OUTER_WALL_V68) return {normalX:0, normalY:1, pushX:0, pushY:TRACK1_OUTER_WALL_V68-y};
    if(y>WORLD-TRACK1_OUTER_WALL_V68) return {normalX:0, normalY:-1, pushX:0, pushY:(WORLD-TRACK1_OUTER_WALL_V68)-y};
    for(const r of TRACK1_OBS_RECTS_V68){

  resolveTrackCollision = function(kart,track,dt){
    if(track && track.index===0){

        kart.angle = kart.faceAngle;
        kart.knockbackX = hit.normalX * 110;
        kart.knockbackY = hit.normalY * 110;

/* === V69 GREEN BOUNCER WALL RICOCHET THEATRE ===
   Green bouncer shields should use solid colored walls as ricochet surfaces.
   They stay dangerous after wall impacts and only disappear on racer hit or lifetime expiry.
*/
(function(){
  const baseSpawnObjectV69 = spawnObject;
  spawnObject = function(type, props={}){
    const isBouncer = String(type).toLowerCase() === String(OBJECT_TYPES.BOUNCER).toLowerCase();
    if(isBouncer){
      const b = Math.max(props.bounces ?? 0, 99);
      props = {
        ...props,
        life: Math.max(props.life ?? 0, 9.5),
        bounces: b,
        initialBounces: b,
        wallRicochet: true,
        ricochetTimer: 0
      };
    }
    return baseSpawnObjectV69(type, props);
  };

  const baseUpdateBouncerV69 = updateBouncer;
  updateBouncer = function(obj, raceState, dt){
    if(!obj || !obj.active) return;
    obj.ricochetTimer = Math.max(0, (obj.ricochetTimer || 0) - dt);
    obj.x += obj.vx * dt;
    obj.y += obj.vy * dt;

    const hit = sampleWallCollision(raceState.track, obj.x, obj.y);
    if(hit){
      const nx = hit.normalX || 0;
      const ny = hit.normalY || 0;
      if(hit.pushX || hit.pushY){
        obj.x += hit.pushX || 0;
        obj.y += hit.pushY || 0;
      }else{
        obj.x += nx * 18;
        obj.y += ny * 18;
      }

      if(obj.ricochetTimer <= 0){
        const dot = obj.vx * nx + obj.vy * ny;
        if(nx || ny){
          if(dot < 0){
            obj.vx = obj.vx - 2 * dot * nx;
            obj.vy = obj.vy - 2 * dot * ny;
          }else{
            const sp = Math.hypot(obj.vx, obj.vy) || (obj.speed || 560);
            obj.vx = nx * sp;
            obj.vy = ny * sp;
          }
        }else{
          obj.vx *= -1;
          obj.vy *= -1;
        }
        const speed = Math.max(520, Math.min(680, Math.hypot(obj.vx,obj.vy) || obj.speed || 560));
        const a = Math.atan2(obj.vy,obj.vx);
        obj.vx = Math.cos(a) * speed;
        obj.vy = Math.sin(a) * speed;
        obj.speed = speed;
        obj.angle = a;
        obj.bounces = Math.max((obj.bounces ?? 99) - 1, 1);
        obj.ownerNoHitTimer = 0;
        obj.graceTimer = 0;
        obj.ricochetTimer = .055;
        if(typeof spawnTinyBounceSpark === 'function') spawnTinyBounceSpark(obj.x, obj.y, raceState);
        else if(typeof spawnPoof === 'function') spawnPoof(obj.x, obj.y, raceState);
      }

      obj.x += obj.vx * .018;
      obj.y += obj.vy * .018;
      obj.x = clamp(obj.x, 48, WORLD-48);
      obj.y = clamp(obj.y, 48, WORLD-48);
      return;
    }

    // For non-wall movement this fully replaces the old bouncer path, so it never
    // despawns merely because bounce count runs out. Lifetime and kart-hit still apply.
    obj.angle = Math.atan2(obj.vy, obj.vx);
  };
})();



/* === V70 TRACK 1 NARROW WALL-CONTOUR COLLISION ===
   Fixes over-generous wall recoil:
   - collision follows visible colored wall contours as line segments
   - road driving near a wall no longer triggers broad rectangle knockback
   - recoil only happens when the kart is actually moving into the wall
*/
(function(){
  const WALL_HALF_V70 = 28; // narrow contour thickness in world px, not a broad zone
  const OUTER_HALF_V70 = 34;

  function rectSegmentsV70(x,y,w,h){
    return [
      [x,y,x+w,y],
      [x+w,y,x+w,y+h],
      [x+w,y+h,x,y+h],
      [x,y+h,x,y]
    ];
  }
  function polySegmentsV70(points){
    const out=[];
    for(let i=0;i<points.length;i++){
      const a=points[i], b=points[(i+1)%points.length];
      out.push([a[0],a[1],b[0],b[1]]);
    }
    return out;
  }
  function track1WallSegmentsV70(){
    const W0 = WORLD;
    const segs = [];
    // Outer arena colored border.
    segs.push(...rectSegmentsV70(0,0,W0,W0));

    // Visible green/island wall contours, matching the map art.
    segs.push(...rectSegmentsV70(W0*.760,0,W0*.240,W0*.112));
    segs.push(...rectSegmentsV70(0,W0*.780,W0*.180,W0*.220));
    segs.push(...rectSegmentsV70(W0*.515,W0*.615,W0*.160,W0*.165));

    const central = [
      [W0*.255,W0*.205],
      [W0*.740,W0*.205],
      [W0*.740,W0*.335],
      [W0*.790,W0*.400],
      [W0*.790,W0*.590],
      [W0*.670,W0*.590],
      [W0*.670,W0*.495],
      [W0*.255,W0*.495]
    ];
    segs.push(...polySegmentsV70(central));
    return segs;
  }
  const TRACK1_WALL_SEGS_V70 = track1WallSegmentsV70();

  function nearestOnSegmentV70(px,py,ax,ay,bx,by){
    const vx=bx-ax, vy=by-ay;
    const len2=vx*vx+vy*vy || 1;
    const t=clamp(((px-ax)*vx+(py-ay)*vy)/len2,0,1);
    const x=ax+vx*t, y=ay+vy*t;
    const dx=px-x, dy=py-y;
    const d=Math.hypot(dx,dy);
    return {x,y,dx,dy,d,t};
  }

  function contourHitV70(x,y){
    let best=null;
    for(const s of TRACK1_WALL_SEGS_V70){
      const n=nearestOnSegmentV70(x,y,s[0],s[1],s[2],s[3]);
      const isOuter = (s[0]===0&&s[1]===0&&s[2]===WORLD&&s[3]===0) ||
                      (s[0]===WORLD&&s[1]===0&&s[2]===WORLD&&s[3]===WORLD) ||
                      (s[0]===WORLD&&s[1]===WORLD&&s[2]===0&&s[3]===WORLD) ||
                      (s[0]===0&&s[1]===WORLD&&s[2]===0&&s[3]===0);
      const half = isOuter ? OUTER_HALF_V70 : WALL_HALF_V70;
      if(n.d <= half && (!best || n.d < best.d)){
        let nx=n.dx/(n.d||1), ny=n.dy/(n.d||1);
        if(n.d<.001){
          // Stable fallback normal from segment orientation.
          const sx=s[2]-s[0], sy=s[3]-s[1];
          nx=-sy; ny=sx;
          const l=Math.hypot(nx,ny)||1; nx/=l; ny/=l;
        }
        best={d:n.d, normalX:nx, normalY:ny, pushX:nx*(half-n.d+2), pushY:ny*(half-n.d+2)};
      }
    }
    return best;
  }

  const baseSampleWallCollisionV70 = sampleWallCollision;
  sampleWallCollision = function(track,x,y){
    if(track && track.index===0){
      const hit=contourHitV70(x,y);
      if(hit) return hit;
      return null;
    }
    return baseSampleWallCollisionV70(track,x,y);
  };

  const baseResolveTrackCollisionV70 = resolveTrackCollision;
  resolveTrackCollision = function(kart,track,dt){
    if(track && track.index===0){
      const near=nearestOnTrack(track,kart.x,kart.y);
      const sfc=sampleSurface(track,kart.x,kart.y);
      if(sfc===SURFACE.ROAD||sfc===SURFACE.ICE||sfc===SURFACE.LAVA||sfc===SURFACE.BRIDGE) kart.lastSafeS=near.s;

      const hit=contourHitV70(kart.x,kart.y);
      if(hit){
        // Always nudge out of the visible contour, but only recoil if moving into it.
        kart.x += hit.pushX;
        kart.y += hit.pushY;

        const vx=Math.cos(kart.moveAngle||kart.faceAngle||0)*(kart.speed||0);
        const vy=Math.sin(kart.moveAngle||kart.faceAngle||0)*(kart.speed||0);
        const intoWall = vx*hit.normalX + vy*hit.normalY < -8;

        if(intoWall){
          const recoil = Math.max(38, Math.min(112, Math.abs(kart.speed||0)*0.18));
          kart.x += hit.normalX * recoil * .20;
          kart.y += hit.normalY * recoil * .20;
          kart.speed *= .68;
          const reflectX = vx - 2*(vx*hit.normalX+vy*hit.normalY)*hit.normalX;
          const reflectY = vy - 2*(vx*hit.normalX+vy*hit.normalY)*hit.normalY;
          kart.moveAngle = Math.atan2(reflectY,reflectX);
          kart.faceAngle = lerpAngle(kart.faceAngle, kart.moveAngle, .22);
          kart.angle = kart.faceAngle;
          kart.knockbackX = hit.normalX * 58;
          kart.knockbackY = hit.normalY * 58;
          kart.knockbackTimer = Math.max(kart.knockbackTimer||0, .045);
          kart.drifting=false;
          if(kart.status==='drift') kart.status='recover';
        }
      }

      safeTrackRecovery(kart,dt);
      return;
    }
    return baseResolveTrackCollisionV70(kart,track,dt);
  };
})();



/* === V71 ROAD-SAFE WALL COLLISION + MINIMAP ITEM OBJECTS ===
   Fixes the hairpin wall problem:
   - Track 1 karts do NOT trigger wall recoil while their center is still on road-code.
   - Wall recoil starts only after leaving the actual road and touching the visible wall contour.
   - Projectiles still use wall collision and bounce from the colored contour walls.
   Adds minimap markers for persistent drops and fired objects.
*/
(function(){
  function isTrack1RoadCenterV71(track,x,y){
    if(!track || track.index!==0) return false;
    try{ return sampleCode(track,x,y)===1; }catch(e){ return false; }
  }

  const baseResolveTrackCollisionV71 = resolveTrackCollision;
  resolveTrackCollision = function(kart,track,dt){
    if(track && track.index===0){
      const near = nearestOnTrack(track,kart.x,kart.y);
      const sfc = sampleSurface(track,kart.x,kart.y);
      if(sfc===SURFACE.ROAD||sfc===SURFACE.ICE||sfc===SURFACE.LAVA||sfc===SURFACE.BRIDGE){
        kart.lastSafeS = near.s;
      }

      // Critical fix: if the kart center is still on the actual road mask,
      // never allow colored wall contours to hijack the player.
      if(isTrack1RoadCenterV71(track,kart.x,kart.y)){
        safeTrackRecovery(kart,dt);
        return;
      }

      const hit = (typeof sampleWallCollision === 'function') ? sampleWallCollision(track,kart.x,kart.y) : null;
      if(hit){
        kart.x += hit.pushX || (hit.normalX||0)*8;
        kart.y += hit.pushY || (hit.normalY||0)*8;

        const vx=Math.cos(kart.moveAngle||kart.faceAngle||0)*(kart.speed||0);
        const vy=Math.sin(kart.moveAngle||kart.faceAngle||0)*(kart.speed||0);
        const intoWall = vx*(hit.normalX||0) + vy*(hit.normalY||0) < -10;

        if(intoWall){
          const nx=hit.normalX||0, ny=hit.normalY||0;
          kart.speed *= .72;
          kart.x += nx * 10;
          kart.y += ny * 10;
          const dot = vx*nx + vy*ny;
          const rx = vx - 2*dot*nx;
          const ry = vy - 2*dot*ny;
          if(Math.hypot(rx,ry)>1){
            kart.moveAngle = Math.atan2(ry,rx);
            kart.faceAngle = lerpAngle(kart.faceAngle,kart.moveAngle,.18);
            kart.angle = kart.faceAngle;
          }
          kart.knockbackX = nx * 42;
          kart.knockbackY = ny * 42;
          kart.knockbackTimer = Math.max(kart.knockbackTimer||0,.035);
          kart.drifting=false;
          if(kart.status==='drift') kart.status='recover';
        }
      }

      return;
    }
    return baseResolveTrackCollisionV71(kart,track,dt);
  };

  function drawMiniObjectSquareV71(x,y,size,fill,accent){

    miniCtx.fillRect(Math.round(x-size/2)-1,Math.round(y-size/2)-1,size+2,size+2);

    if(t.includes('bouncer')||t.includes('green')||t.includes('shell')) return {fill:'#58ef67',accent:'#d7ffd8',size:6}; // green shell / bouncer
    if(t.includes('drop')||t.includes('slime')||t.includes('oil')||t.includes('heavy')||t.includes('banana')) return {fill:'#ffd84d',accent:'#6b3b00',size:5};

/* === V72 ROUNDED MINIMAP HAZARDS ===
   - Hazards/projectiles are circles, racers remain squares.

   - Green ricocheting shells stay visible as green dots on the minimap.

/* === V74 CRISP RETRO+ RESOLUTION PASS ===
   Goal: improve graphics without making the game blurry/plastic.
   - 2x internal canvas resolution.
   - Logical game coordinates stay 320x240, so gameplay/UI does not shift.
   - Floor renderer uses smaller sampling blocks.
   - Hybrid floor sample: mostly nearest, partly bilinear, with subtle quantization/dither.
*/
(function(){
  const INTERNAL_SCALE_V74 = 2;

  function applyHighResCanvasV74(){
    try{
      const cssW = gameCanvas.style.width;
      const cssH = gameCanvas.style.height;
      if(gameCanvas.width !== W * INTERNAL_SCALE_V74 || gameCanvas.height !== H * INTERNAL_SCALE_V74){
        gameCanvas.width = W * INTERNAL_SCALE_V74;
        gameCanvas.height = H * INTERNAL_SCALE_V74;
        if(cssW) gameCanvas.style.width = cssW;
        if(cssH) gameCanvas.style.height = cssH;
      }
      ctx.setTransform(INTERNAL_SCALE_V74,0,0,INTERNAL_SCALE_V74,0,0);
      ctx.imageSmoothingEnabled = false;
      gameCanvas.style.imageRendering = 'auto';
    }catch(e){}
  }

  const baseRenderV74 = render;
  render = function(){
    applyHighResCanvasV74();
    return baseRenderV74();
  };

  const baseDrawAttractV74 = drawAttract;
  drawAttract = function(){
    applyHighResCanvasV74();
    return baseDrawAttractV74();
  };

  function dataForTrackV74(track){
    return track?.worldGfxDataV66 || track?.worldGfxDataV65 || track?.worldGfxDataV64 || track?.gfxData || null;
  }
  function parseRgbStringV74(s){
    const m = String(s||'').match(/(\d+),\s*(\d+),\s*(\d+)/);
    if(m) return [Number(m[1]),Number(m[2]),Number(m[3])];
    return [120,120,120];
  }
  function shadeQuantV74(r,g,b,shade,x,y){
    let scan = (y & 2) ? -3 : 0;
    let dither = (((x>>2)+(y>>2)) & 1) ? 2 : -2;
    r = r*shade + scan + dither;
    g = g*shade + scan + dither;
    b = b*shade + scan + dither;
    const q = 6; // small quantization: crisp retro, not plastic
    r = clamp(Math.round(r/q)*q,0,255);
    g = clamp(Math.round(g/q)*q,0,255);
    b = clamp(Math.round(b/q)*q,0,255);
    return cachedShade(r,g,b,1);
  }
  function sampleHybridFloorV74(track,x,y,z,screenX,screenY){
    const d = dataForTrackV74(track);
    if(!d || x<0 || y<0 || x>=WORLD || y>=WORLD){
      const base = parseRgbStringV74(sampleGfx(track,x,y,z));
      return shadeQuantV74(base[0],base[1],base[2],1,screenX,screenY);
    }

    const u = clamp((x/WORLD*MAP),0,MAP-1.001);
    const v = clamp((y/WORLD*MAP),0,MAP-1.001);
    const ix = u|0, iy = v|0;
    const fx = u-ix, fy = v-iy;

    const k00=(iy*MAP+ix)*4;
    const ix1=Math.min(ix+1,MAP-1), iy1=Math.min(iy+1,MAP-1);
    const k10=(iy*MAP+ix1)*4;
    const k01=(iy1*MAP+ix)*4;
    const k11=(iy1*MAP+ix1)*4;

    function lerp(a,b,t){return a+(b-a)*t;}
    const nr=d[k00], ng=d[k00+1], nb=d[k00+2];

    const br0=lerp(d[k00],d[k10],fx), bg0=lerp(d[k00+1],d[k10+1],fx), bb0=lerp(d[k00+2],d[k10+2],fx);
    const br1=lerp(d[k01],d[k11],fx), bg1=lerp(d[k01+1],d[k11+1],fx), bb1=lerp(d[k01+2],d[k11+2],fx);
    const br=lerp(br0,br1,fy), bg=lerp(bg0,bg1,fy), bb=lerp(bb0,bb1,fy);

    // Hybrid: nearest keeps retro solidity; bilinear removes harsh block mush.
    const mix = z < 620 ? .42 : z < 1400 ? .32 : .18;
    let r = nr*(1-mix)+br*mix;
    let g = ng*(1-mix)+bg*mix;
    let b = nb*(1-mix)+bb*mix;

    let shade = 1.055 - Math.min(z/3300,.52)*.25;
    shade += (((screenX>>3)+(screenY>>3))&1) ? -.010 : .010;
    return shadeQuantV74(r,g,b,shade,screenX,screenY);
  }

  const baseRenderFloorV74 = renderFloor;
  renderFloor = function(tr,cam){
    updatePaletteCyclingV18(tr,game.frameCount||0);
    updateBeachSurfAnimationV18(tr,game.frameCount||0);

    const cos=Math.cos(cam.angle), sin=Math.sin(cam.angle);
    const camH=74+(cam.z||0)*20, proj=104, fov=.78;
    const startY=Math.max(Math.floor(HORIZON+2),0);

    // Higher quality than the old 3/4px floor blocks, still safe for mobile.
    const farCap = 3300;
    for(let y=startY;y<H;y+=2){
      const dy=y-HORIZON;
      if(dy<=1) continue;
      let z=(camH*proj)/dy;
      if(!Number.isFinite(z)||z<=0) continue;
      if(z>farCap) z=farCap;
      const half=z*fov;
      const rowH = y>204 ? 3 : 2;
      for(let x=0;x<W;x+=2){
        const nx=(x-W/2)/(W/2);
        const lat=nx*half;
        const wx=cam.x+cos*z-sin*lat;
        const wy=cam.y+sin*z+cos*lat;
        ctx.fillStyle=sampleHybridFloorV74(tr,wx,wy,z,x,y);
        ctx.fillRect(x,y,2,rowH);
      }
    }

    // very subtle scanline/retro texture, not a heavy CRT filter
    ctx.save();
    ctx.globalAlpha=.045;
    ctx.fillStyle='#000000';
    for(let y=HORIZON+2;y<H;y+=4) ctx.fillRect(0,y,W,1);
    ctx.restore();

    if(cam.boost>0){
      ctx.globalAlpha=.20;
      ctx.fillStyle='#fff6a2';
      for(let i=0;i<12;i++) ctx.fillRect((i*43+game.elapsed*210)%W,HORIZON+20+(i*13)%105,18,1);
      ctx.globalAlpha=1;
    }
  };

  // Run once immediately; render wrapper keeps it stable after resize/orientation changes.
  applyHighResCanvasV74();
})();

/* === V76 ANTI-STUCK RESCUE WATCHDOG ===
   Safety measure:
   If a kart is clipped/stuck and barely moves for too long, recover it to the
   last safe track node. This is not meant to punish normal driving.
*/
(function(){
  const STUCK_CONFIG_V76 = {
    minTimerPlayer: 3.25,
    minTimerCpu: 2.75,
    minMovePx: 5.0,
    minProgress: 7.0,
    lowSpeed: 18,
    hardOffroadDistMul: 0.82
  };

  function isRescueLikeV76(k){
    return !!(k.inputLocked || k.rescueTimer>0 || String(k.status||'').startsWith('rescue') || k.finished);
  }

  function shouldWatchStuckV76(k,track){
    if(!game || state!=='race' || !game.go || !track || isRescueLikeV76(k)) return false;
    if(k.status==='spin' || k.status==='flatten' || k.status==='knockback') return false;
    return true;
  }

  function antiStuckRescueV76(k,track,dt){
    if(!shouldWatchStuckV76(k,track)){
      k._stuckTimerV76 = 0;
      k._stuckPrevV76 = null;
      return;
    }

    const near = nearestOnTrack(track,k.x,k.y);
    const onRoad = (typeof sampleCode === 'function' && sampleCode(track,k.x,k.y)===1);
    if(onRoad) k.lastSafeS = near.s;

    const prev = k._stuckPrevV76 || {x:k.x,y:k.y,s:near.s};
    const moved = Math.hypot(k.x-prev.x,k.y-prev.y);
    let ds = Math.abs((near.s||0)-(prev.s||0));
    if(ds > track.len*.5) ds = track.len-ds;

    const verySlow = Math.abs(k.speed||0) < STUCK_CONFIG_V76.lowSpeed;
    const noProgress = moved < STUCK_CONFIG_V76.minMovePx && ds < STUCK_CONFIG_V76.minProgress;
    const offRoadOrTooFar = !onRoad || near.dist > track.width*STUCK_CONFIG_V76.hardOffroadDistMul;

    // Player: only rescue if they are trying to drive, or clearly off-road/clipped.
    // CPU: rescue automatically when it stops progressing.
    const tryingToMove = k.player ? (!!input?.gas || !!input?.touch?.gas || offRoadOrTooFar) : true;

    if(verySlow && noProgress && tryingToMove){
      k._stuckTimerV76 = (k._stuckTimerV76||0) + dt;
    }else{
      k._stuckTimerV76 = Math.max(0,(k._stuckTimerV76||0) - dt*1.8);
    }

    k._stuckPrevV76 = {x:k.x,y:k.y,s:near.s};

    const limit = k.player ? STUCK_CONFIG_V76.minTimerPlayer : STUCK_CONFIG_V76.minTimerCpu;
    if((k._stuckTimerV76||0) >= limit){
      const keepCoins = k.coins||0;
      k._stuckTimerV76 = 0;
      k._stuckPrevV76 = null;

      // Prefer last safe S if available; otherwise nearest road center.
      if(!k.lastSafeS && k.lastSafeS!==0) k.lastSafeS = near.s;
      startRescue(k,track,k.player?'RECOVERED':'CPU RECOVER');
      // Anti-softlock rescue should not punish coins.
      k.coins = keepCoins;
      if(k.player && game.messages) game.messages.push({text:'STUCK RESCUE',t:.9});
    }
  }

  const updateRacersBaseV76 = updateRacers;
  updateRacers = function(dt){
    updateRacersBaseV76(dt);
    if(!game || state!=='race' || !game.track || !Array.isArray(game.racers)) return;
    for(const k of game.racers) antiStuckRescueV76(k,game.track,dt);
  };
})();

/* === V78 STATELENS REACTIVE KART STATES ===
   Canonical StateLens operators become tiny live state plates on kart backs.
   Imported URL state becomes a seed; in-game events become the live overlay.
   Examples:
   ?state=q-vvv-p
   ?route=q-vvv-p,n-vvv-n,r-vvv-r
*/
(function(){
  const STATE_OPS_V78={
    'o-vvv-o':{label:'FIELD',color:'#9ed7ff',dark:'#102137'},
    'o-www-o':{label:'WEB',color:'#78ddff',dark:'#102137'},
    'ovvv-o':{label:'SCOUT L',color:'#9fe27d',dark:'#14240e'},
    'o-vvvo':{label:'SCOUT R',color:'#b9ee7a',dark:'#18240e'},
    'q-vvv-p':{label:'ASK',color:'#ffe36d',dark:'#332608'},
    'n-vvv-n':{label:'FOCUS',color:'#76b7ff',dark:'#0f1c33'},
    '0-vvv-0':{label:'VALID',color:'#ffffff',dark:'#222733'},
    'p-vvv-q':{label:'RESOLVE',color:'#90ff9d',dark:'#0d2a16'},
    'o-mmm-o':{label:'INGEST',color:'#ffcc73',dark:'#2b1c0b'},
    'u-vvv-u':{label:'ARCHIVE',color:'#b9c8ff',dark:'#151933'},
    'd-vvv-b':{label:'OBJECT',color:'#ffb65c',dark:'#2b1607'},
    'b-vvv-d':{label:'RETURN',color:'#ffc76d',dark:'#2b1b08'},
    'x-vvv-x':{label:'CONFLICT',color:'#ff6666',dark:'#321010'},
    'e-vvv-e':{label:'EMPTY',color:'#9ba6b9',dark:'#161a22'},
    'a-vvv-a':{label:'ACTIVE',color:'#73ffc4',dark:'#08271a'},
    's-vvv-s':{label:'SYNC',color:'#83f2ff',dark:'#08252b'},
    'r-vvv-r':{label:'REPAIR',color:'#ff9c5a',dark:'#2e1708'},
    'z-vvv-z':{label:'SLEEP',color:'#7d89b8',dark:'#111525'}
  };
  const VALID_STATE_OPS_V78=Object.keys(STATE_OPS_V78);
  function validOpV78(op){op=String(op||'').trim();return STATE_OPS_V78[op]?op:null;}
  function importedRouteV78(){
    try{
      const q=new URLSearchParams(location.search);
      const raw=(q.get('route')||q.get('state')||'').trim();
      if(!raw)return [];
      return raw.split(/[,\s>]+/).map(validOpV78).filter(Boolean).slice(0,9);
    }catch(e){return [];}
  }
  const ROUTE_SEED_V78=importedRouteV78();
  function seedForKartV78(kart){
    if(ROUTE_SEED_V78.length)return ROUTE_SEED_V78[(kart?.rosterIndex||0)%ROUTE_SEED_V78.length];
    const defaults=['a-vvv-a','n-vvv-n','q-vvv-p','0-vvv-0','d-vvv-b','s-vvv-s','o-vvv-o','p-vvv-q'];
    return defaults[(kart?.rosterIndex||0)%defaults.length];
  }
  function pulseStateV78(kart,op,t=.65){
    op=validOpV78(op); if(!kart||!op)return;
    kart._statePulseV78={op,t};
  }
  function nearbyThreatV78(kart){
    if(!game||!kart)return false;
    const maxD2=(kart.player?180:130)**2;
    function nearObj(o){
      if(!o||o.dead||o.active===false)return false;
      if(o.owner===kart||o.ownerId===kart.id)return false;
      if(typeof o.x!=='number'||typeof o.y!=='number')return false;
      return dist2(kart.x,kart.y,o.x,o.y)<maxD2;
    }
    for(const o of (game.projectiles||[]))if(nearObj(o))return true;
    for(const o of (game.dropped||[]))if(nearObj(o))return true;
    for(const o of (game.objectPool||[]))if(nearObj(o))return true;
    return false;
  }
  function closeRivalPressureV78(kart){
    if(!game||!kart||!Array.isArray(game.racers))return false;
    for(const r of game.racers){
      if(r===kart||r.finished)continue;
      if(dist2(kart.x,kart.y,r.x,r.y)<95*95)return true;
    }
    return false;
  }
  function currentStateOpV78(kart){
    if(!kart)return 'e-vvv-e';
    if(kart._statePulseV78&&kart._statePulseV78.t>0)return kart._statePulseV78.op;
    if(kart.finished||game?.mode==='race_finish_freeze')return 'u-vvv-u';
    if(kart.inputLocked||kart.rescueTimer>0||String(kart.status||'').startsWith('rescue'))return 'r-vvv-r';
    if((kart.spinTimer||0)>0||(kart.stun||0)>0||kart.status==='spin'||kart.status==='flatten'||(kart.damageCooldown||0)>.95)return 'x-vvv-x';
    if((kart.aura||0)>0)return 'a-vvv-a';
    if(kart.player&&game?.roulette)return 's-vvv-s';
    if((kart.boost||0)>0)return 'a-vvv-a';
    if((kart.vaultTimer||0)>0)return 'o-vvvo';
    if(kart.player?!!game?.currentItem:!!kart.item)return 'd-vvv-b';
    if(kart.drifting||kart.status==='drift'){
      const ds=kart.driftSide||kart.steerSign||0;
      if(ds<0)return 'ovvv-o';   // Scout Left / Pioneer
      if(ds>0)return 'o-vvvo';   // Scout Right / Movement
      return 'n-vvv-n';
    }
    if(nearbyThreatV78(kart))return 'q-vvv-p';
    if(closeRivalPressureV78(kart))return 'q-vvv-p';
    if(kart.surfaceType&&kart.surfaceType!=='road'&&kart.surfaceType!=='ice'&&kart.surfaceType!=='lava')return 'q-vvv-p';
    if(Math.abs(kart.speed||0)>85&&sampleCode(game.track,kart.x,kart.y)===1)return '0-vvv-0';
    if(game?.go)return seedForKartV78(kart);
    return 'z-vvv-z';
  }
  function updateStateLensV78(dt){
    if(!game||!Array.isArray(game.racers))return;
    for(const k of game.racers){
      if(k._statePulseV78)k._statePulseV78.t=Math.max(0,(k._statePulseV78.t||0)-dt);
      const op=currentStateOpV78(k);
      if(k._stateOpV78!==op){
        k._stateOpV78=op;
        k._stateChangedAtV78=game.elapsed||0;
        k._stateTrailV78=k._stateTrailV78||[];
        k._stateTrailV78.push(op);
        if(k._stateTrailV78.length>9)k._stateTrailV78.shift();
      }
    }
  }

  const updateBaseV78=update;
  update=function(dt){
    updateBaseV78(dt);
    updateStateLensV78(dt);
  };

  // Event pulses make short-lived actions visible even if the gameplay flag changes quickly.
  if(typeof beginItemRoulette==='function'){
    const beginItemRouletteBaseV78=beginItemRoulette;
    beginItemRoulette=function(finalItem){
      const p=game?.racers?.find(r=>r.player)||game?.racers?.[0];
      pulseStateV78(p,'s-vvv-s',1.55);
      return beginItemRouletteBaseV78(finalItem);
    };
  }
  if(typeof useCurrentItem==='function'){
    const useCurrentItemBaseV78=useCurrentItem;
    useCurrentItem=function(kart,raceState){
      const item=kart?.player?game?.currentItem:kart?.item;
      const out=useCurrentItemBaseV78(kart,raceState);
      if(kart&&item){
        if(item==='BOOST'||item==='AURA'||item==='VAULT')pulseStateV78(kart,'a-vvv-a',.85);
        else if(item==='DROPPER'||item==='SEEKER'||item==='BOUNCER'||item==='SHRINK_WAVE')pulseStateV78(kart,'p-vvv-q',.75);
        else pulseStateV78(kart,'d-vvv-b',.65);
      }
      return out;
    };
  }
  if(typeof pickItem==='function'){
    const pickItemBaseV78=pickItem;
    pickItem=function(kart){
      const before=kart?.player?game?.currentItem:kart?.item;
      const rb=!!game?.roulette;
      const out=pickItemBaseV78(kart);
      const after=kart?.player?game?.currentItem:kart?.item;
      if(kart&&(!before&&!rb)&&(after||game?.roulette))pulseStateV78(kart,'o-mmm-o',.75);
      return out;
    };
  }
  if(typeof hitKart==='function'){
    const hitKartBaseV78=hitKart;
    hitKart=function(kart,hitType,source){
      const out=hitKartBaseV78(kart,hitType,source);
      if(kart)pulseStateV78(kart,(kart.aura>0?'a-vvv-a':'x-vvv-x'),.9);
      return out;
    };
  }
  if(typeof triggerSpinOut==='function'){
    const triggerSpinOutBaseV78=triggerSpinOut;
    triggerSpinOut=function(kart,source,raceState){
      const out=triggerSpinOutBaseV78(kart,source,raceState);
      if(kart)pulseStateV78(kart,'x-vvv-x',1.1);
      return out;
    };
  }
  if(typeof startRescue==='function'){
    const startRescueBaseV78=startRescue;
    startRescue=function(kart,track,msg){
      const out=startRescueBaseV78(kart,track,msg);
      if(kart)pulseStateV78(kart,'r-vvv-r',1.25);
      return out;
    };
  }
  if(typeof finishKart==='function'){
    const finishKartBaseV78=finishKart;
    finishKart=function(kart){
      const out=finishKartBaseV78(kart);
      if(kart)pulseStateV78(kart,'u-vvv-u',2.0);
      return out;
    };
  }

  function drawStateLensPlateV78(x,y,sc,kart,frame='back'){
    if(!kart||!shouldRenderKart(kart)||sc<.18)return;
    const driftFrame=String(frame||'back').indexOf('drift_')===0;
    const baseFrame=String(frame||'back').replace('drift_','');
    const back=baseFrame==='back'||baseFrame==='back_left'||baseFrame==='back_right';
    if(!back)return;
    const side=baseFrame==='left'||baseFrame==='right';
    const lean=(baseFrame.includes('left')?-1:baseFrame.includes('right')?1:0);
    const op=kart._stateOpV78||currentStateOpV78(kart);
    const st=STATE_OPS_V78[op]||STATE_OPS_V78['e-vvv-e'];

    const flash=age<.22?1:0;

    if(kart.status==='flatten')ctx.scale(1,.42);

    if(driftFrame)ctx.rotate(lean*.10);

    const w=37,h=8,px=-w/2,py=-6; // state plate lowered so it sits about 2px above the kart base.
    ctx.fillStyle=flash?'#ffffff':'rgba(3,6,14,.96)';
    ctx.fillRect(px-1,py-1,w+2,h+2);
    ctx.fillStyle=st.dark;
    ctx.fillRect(px,py,w,h);
    ctx.fillStyle=st.color;
    ctx.fillRect(px+1,py+1,3,h-2);
    ctx.font='5px monospace';
    ctx.textBaseline='top';
    ctx.fillStyle='rgba(0,0,0,.75)';
    ctx.fillText(op,px+6.5,py+2);
    ctx.fillStyle=st.color;
    ctx.fillText(op,px+6,py+1);
    ctx.restore();
  }

  const drawPlayerKartBaseV78=drawPlayerKart;
  drawPlayerKart=function(x,y,racer,sc=1,steer=0,boost=0,victory=false,aura=0,tiny=0,frame='back',kart=null){
    const out=drawPlayerKartBaseV78(x,y,racer,sc,steer,boost,victory,aura,tiny,frame,kart);

  function drawStateLensHudV78(){
    if(state!=='race'||!game)return;
    const p=game.racers.find(r=>r.player)||game.racers[0];
    if(!p)return;
    const op=p._stateOpV78||currentStateOpV78(p);

    const y=H-39;

    ctx.fillRect(6,y,96,13);

    ctx.fillRect(9,y+3,4,7);

    let tx=106;
    for(const t of trail){
      const s=STATE_OPS_V78[t]||STATE_OPS_V78['e-vvv-e'];

    }
    ctx.restore();
  }
  const renderHUDBaseV78=renderHUD;
  renderHUD=function(){
    renderHUDBaseV78();
    drawStateLensHudV78();

  const renderTitleBaseV78=renderTitle;

      if(hero&&!menu.querySelector('[data-statelens-v78]')){
        const n=el('div','miniNote','v81 prototype: track 1 now uses the same lightning item blocks as the rest of the first cup. Drift still maps to canonical Scout Left / Scout Right operators.');
        n.setAttribute('data-statelens-v78','1');
        hero.appendChild(n);
      }
    }catch(e){}
  };
  if(state==='title')renderTitle();

  window.StateLensKartV78={ops:STATE_OPS_V78,route:ROUTE_SEED_V78,current:k=>currentStateOpV78(k)};
})();


/* === V81 TRACK 1 LIGHTNING ITEM BOX CONSISTENCY ===
   Circuit 1 used the older question-mark item sprite from the track-1 asset pass.
   For cup consistency, force the opener to use the same lightning block language as the rest of the cup. */
(function(){
  const baseDrawItemPadV81 = drawItemPad;

  function drawLightningItemPanelV81(x,y,s,spin=0){
    const scale=clamp(s,0.18,1.65);
    const size=clamp(28*scale,8,30);
    const bob=Math.sin((game?game.elapsed:0)*5.5+spin)*Math.max(1,scale*2);
    const skew=Math.sin((game?game.elapsed:0)*3.0+spin)*.10;
    ctx.save();
    ctx.imageSmoothingEnabled=false;
    ctx.translate(Math.round(x),Math.round(y-bob));
    ctx.fillStyle='rgba(0,0,0,.34)';
    ctx.beginPath();
    ctx.ellipse(0,size*.34+bob,size*.62,size*.18,0,0,TAU);
    ctx.fill();
    ctx.translate(0,-size*.55);
    ctx.transform(1,0,skew,1,0,0);
    const w=size,h=size*.78;
    ctx.fillStyle='#020611';
    ctx.fillRect(-w*.57,-h*.44,w*1.14,h*.88);
    ctx.fillStyle='#5fd2ff';
    ctx.fillRect(-w*.53,-h*.50,w*1.06,3);
    ctx.fillStyle='#122d56';
    ctx.fillRect(-w*.43,-h*.38,w*.86,h*.76);
    ctx.fillStyle='#fff06a';
    ctx.fillRect(-w*.30,-h*.24,w*.60,h*.50);
    ctx.fillStyle='#14305a';
    ctx.beginPath();
    ctx.moveTo(-w*.02,-h*.18);
    ctx.lineTo(w*.18,-h*.18);
    ctx.lineTo(w*.04,h*.02);
    ctx.lineTo(w*.20,h*.02);
    ctx.lineTo(-w*.12,h*.28);
    ctx.lineTo(-w*.02,h*.08);
    ctx.lineTo(-w*.18,h*.08);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle='#020611';
    ctx.lineWidth=1;
    ctx.strokeRect(Math.round(-w*.57)+.5,Math.round(-h*.44)+.5,Math.round(w*1.14),Math.round(h*.88));
    if(((game?game.frameCount:0)+Math.round(spin*7))%18<9){
      ctx.fillStyle='rgba(255,255,255,.75)';
      ctx.fillRect(w*.30,-h*.35,2,5);
      ctx.fillRect(-w*.45,-h*.42,5,1);
    }
    ctx.restore();
  }

  drawItemPad = function(x,y,s,spin=0){
    if(game?.track?.index===0){
      if(typeof drawDriftlineItemPanelV47==='function') return drawDriftlineItemPanelV47(x,y,s,spin);
      return drawLightningItemPanelV81(x,y,s,spin);
    }
    return baseDrawItemPadV81(x,y,s,spin);
  };

  function drawMapLightningBlockV81(g,x,y,size=16){
    const sz=size;
    g.save();
    g.translate(x,y);
    g.fillStyle='#020611';
    g.fillRect(-sz*.50,-sz*.50,sz,sz);
    g.fillStyle='#5fd2ff';
    g.fillRect(-sz*.44,-sz*.44,sz*.88,sz*.18);
    g.fillStyle='#122d56';
    g.fillRect(-sz*.44,-sz*.25,sz*.88,sz*.70);
    g.fillStyle='#fff06a';
    g.fillRect(-sz*.31,-sz*.27,sz*.62,sz*.56);
    g.fillStyle='#14305a';
    g.beginPath();
    g.moveTo(-sz*.02,-sz*.22);
    g.lineTo(sz*.19,-sz*.22);
    g.lineTo(sz*.04,0);
    g.lineTo(sz*.22,0);
    g.lineTo(-sz*.12,sz*.30);
    g.lineTo(-sz*.02,sz*.08);
    g.lineTo(-sz*.20,sz*.08);
    g.closePath();
    g.fill();
    g.restore();
  }

  const baseGenerateTrackMapsV81 = generateTrackMaps;
  generateTrackMaps = function(t){
    baseGenerateTrackMapsV81(t);
    if(!t || t.index!==0 || !t.mapCanvas || !Array.isArray(t.itemBoxes)) return;
    const g=t.mapCanvas.getContext('2d');
    const sc=MAP/WORLD;
    for(const it of t.itemBoxes) drawMapLightningBlockV81(g,it.x*sc,it.y*sc,16);
    t.gfxData=g.getImageData(0,0,MAP,MAP).data;
    if(t.thumb){
      const tx=t.thumb.getContext('2d');
      tx.clearRect(0,0,t.thumb.width,t.thumb.height);
      tx.drawImage(t.mapCanvas,0,0,t.thumb.width,t.thumb.height);
      tx.strokeStyle='rgba(255,255,255,.65)';
      tx.lineWidth=3;
      tx.strokeRect(1,1,t.thumb.width-2,t.thumb.height-2);
    }
  };

  try{
    if(Array.isArray(tracks) && tracks[0]){
      generateTrackMaps(tracks[0]);
      if(state!=='race' && typeof renderTitle==='function') renderTitle();
    }
  }catch(err){ console.warn('V81 track-1 lightning item refresh failed',err); }
})();

    const vw=Math.max(800,innerWidth||800),vh=Math.max(520,innerHeight||520);

    const totalH=stageH+gapA+mapH+gapB+controlsH;
    const top=Math.max(8,Math.floor((vh-totalH)/2));
    const mapTop=top+stageH+gapA;

    rootV82.style.setProperty('--v82-map-top',mapTop+'px');
    rootV82.style.setProperty('--v82-controls-top',controlsTop+'px');

    const dpr=clamp(window.devicePixelRatio||1,1,2);

  const attractBaseV82=drawAttract;

  function setKeyStateV82(name,down){

  }
  function clearDesktopKeysV82(){
    if(!input)return;
    for(const k of ['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright','space','e','f','shift'])setKeyStateV82(k,false);
    input.item=false;input.jump=false;input.drift=false;

  function relevantRaceKeyV82(code){
    return ['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','KeyE','KeyF','ShiftLeft','ShiftRight'].includes(code);
  }
  function normalizedKeyV82(code){
    return ({KeyW:'w',KeyA:'a',KeyS:'s',KeyD:'d',ArrowUp:'arrowup',ArrowDown:'arrowdown',ArrowLeft:'arrowleft',ArrowRight:'arrowright',Space:'space',KeyE:'e',KeyF:'f',ShiftLeft:'shift',ShiftRight:'shift'})[code]||'';

    if(e.code==='KeyA'||e.code==='KeyD'){
      input.keyboardDriftSide=keys.a&&!keys.d?-1:keys.d&&!keys.a?1:0;
      if(!keys.a&&!keys.d)input.drift=false;

    if(e.code==='Space'||e.code==='KeyE'||e.code==='KeyF')input.item=!!(input.touch.item||keys.space||keys.e||keys.f);

  const pollKeyboardBaseV82=pollKeyboard;
  pollKeyboard=function(){
    if(!input)return;

    const arrowSteer=(k.arrowleft?-1:0)+(k.arrowright?1:0);

    const keySteer=directionalDrift?(driftSteer<0?-1:1):arrowSteer;
    input.keyboardDriftSide=directionalDrift?(driftSteer<0?-1:1):0;
    input.steer=input.stickId!==null?input.touch.steer:keySteer;
    input.gas=!!(input.touch.gas||k.arrowup||k.w);
    input.brake=!!(input.touch.brake||k.arrowdown||k.s);
    input.item=!!(input.touch.item||k.e||k.f||k.space);
    input.jump=!!(input.touch.jump||k.shift);
    if((input.driftHoldGrace||0)>0)input.driftHoldGrace=Math.max(0,input.driftHoldGrace-1/60);
    input.drift=!!(input.touch.drift||directionalDrift||k.z||k.c||k.control||(input.driftHoldGrace||0)>0);

  window.addEventListener('blur',clearDesktopKeysV82);
  window.addEventListener('resize',applyLayoutV82,{passive:true});
