/* === V85 ITEM HOLD + OFF-ROAD CONSEQUENCE + SEEKER SPEED ===
   - Fixes accidental directory text inside lap/round counters.
   - Red SEEKER always outruns player and CPU karts.
   - Grass/off-road is a serious mistake unless a boost bypass is active.
   - Holding ITEM keeps DROPPER or BOUNCER behind the player; releasing lays it down.
     SEEKER remains fire-only and can never be placed behind.
*/
(function(){
  const HOLDABLE_ITEMS_V85 = new Set(['DROPPER','BOUNCER']);

  // Faster than the absolute 150cc + coin + boost/rubber-band ceiling.
  if(typeof SEEKER_CONFIG_V22 !== 'undefined'){
    SEEKER_CONFIG_V22.speed = 1250;
    SEEKER_CONFIG_V22.life = Math.max(SEEKER_CONFIG_V22.life || 0, 6.0);
    SEEKER_CONFIG_V22.homingTurnRate = Math.max(SEEKER_CONFIG_V22.homingTurnRate || 0, 18.0);
    SEEKER_CONFIG_V22.closeHomingTurnRate = Math.max(SEEKER_CONFIG_V22.closeHomingTurnRate || 0, 27.0);
  }

  // Strong grass/off-road consequence. Existing boost/aura bypass stays authoritative.
  if(SURFACE_MODIFIERS && SURFACE_MODIFIERS.offroad){
    Object.assign(SURFACE_MODIFIERS.offroad,{
      maxSpeed:.22,
      accel:.28,
      traction:.50,
      breaksDrift:true
    });
  }

  const applySurfaceStateBaseV85 = applySurfaceState;
  applySurfaceState = function(kart,surface,stats,dt){
    applySurfaceStateBaseV85(kart,surface,stats,dt);
    if(!kart || surface!==SURFACE.OFFROAD || (kart.offroadBypassTimer||0)>0 || kart.inputLocked)return;
    const runtimeStats = kart.player && typeof getRuntimeKartStats==='function'
      ? getRuntimeKartStats(kart,game)
      : (stats || kart.stats || kart);
    const roadMax = runtimeStats.max || kart.stats?.max || 360;
    const offroadTarget = roadMax * .20;
    kart.speed = approach(kart.speed||0,offroadTarget,760*dt);
  };

  function playerKartV85(){
    return game?.racers?.find(r=>r.player) || null;
  }

  function heldPositionV85(kart){
    const angle = kart.faceAngle ?? kart.angle ?? 0;
    const distanceBehind = 70;
    return {
      x:kart.x-Math.cos(angle)*distanceBehind,
      y:kart.y-Math.sin(angle)*distanceBehind,
      angle
    };
  }

  function syncHeldObjectV85(obj,raceState){
    if(!obj?.heldByIdV85)return false;
    const owner = getRacerById(raceState,obj.heldByIdV85);
    if(!owner || owner.finished || String(owner.status||'').startsWith('rescue')){
      despawnObject(obj);
      return true;
    }
    const p=heldPositionV85(owner);
    obj.x=p.x; obj.y=p.y;
    obj.angle=p.angle;
    obj.vx=0; obj.vy=0; obj.speed=0;
    obj.bridgeZone=owner.bridgeZone??0;
    obj.graceTimer=999;
    obj.ownerNoHitTimer=999;
    obj.life=Math.max(obj.life||0,2.0);
    obj.state='held';
    return true;
  }

  const updateBouncerBaseV85=updateBouncer;
  updateBouncer=function(obj,raceState,dt){
    if(syncHeldObjectV85(obj,raceState))return;
    if(obj?.placedBehindV85){
      obj.vx=0;obj.vy=0;obj.speed=0;obj.state='placed';
      return;
    }
    return updateBouncerBaseV85(obj,raceState,dt);
  };

  const updateDropperBaseV85=updateDropper;
  updateDropper=function(obj,raceState,dt){
    if(syncHeldObjectV85(obj,raceState))return;
    return updateDropperBaseV85(obj,raceState,dt);
  };

  function clearHeldStateV85(kart,consumeInventory){
    const item=kart?.heldItemTypeV85;
    if(!kart)return;
    if(consumeInventory && kart.player && game?.currentItem===item)game.currentItem=null;
    kart.heldItemTypeV85=null;
    kart.heldItemObjectV85=null;
    kart.itemButtonWasDownV85=false;
  }

  function beginHeldItemV85(kart,item,raceState){
    if(!kart||!raceState||!HOLDABLE_ITEMS_V85.has(item)||kart.heldItemObjectV85)return false;
    const p=heldPositionV85(kart);
    const type=item==='BOUNCER'?OBJECT_TYPES.BOUNCER:OBJECT_TYPES.DROPPER;
    const obj=spawnObject(type,{
      ownerId:kart.id,
      heldByIdV85:kart.id,
      heldItemV85:true,
      bridgeZone:kart.bridgeZone??0,
      x:p.x,y:p.y,angle:p.angle,
      vx:0,vy:0,speed:0,
      life:30,
      bounces:99,initialBounces:99,
      radius:item==='BOUNCER'?34:32,
      radiusX:item==='BOUNCER'?32:30,
      radiusY:item==='BOUNCER'?32:30,
      graceTimer:999,
      ownerNoHitTimer:999,
      mode:'HELD_BEHIND',
      state:'held',
      kind:item==='DROPPER'?'banana':undefined,
      paletteId:item==='BOUNCER'?'bouncer':'dropper'
    });
    if(!obj)return false;
    kart.heldItemTypeV85=item;
    kart.heldItemObjectV85=obj;
    kart.itemButtonWasDownV85=true;
    if(kart.player)raceState.messages.push({text:'HOLD '+item,t:.45});
    return true;
  }

  function releaseHeldItemV85(kart,raceState){
    const obj=kart?.heldItemObjectV85;
    const item=kart?.heldItemTypeV85;
    if(!kart||!obj||!item)return false;

    if(!obj.active){
      clearHeldStateV85(kart,true);
      return true;
    }

    const p=heldPositionV85(kart);
    obj.heldByIdV85=null;
    obj.heldItemV85=false;
    obj.placedBehindV85=true;
    obj.x=p.x;obj.y=p.y;
    obj.vx=0;obj.vy=0;obj.speed=0;
    obj.bridgeZone=kart.bridgeZone??0;
    obj.life=item==='BOUNCER'?12:14;
    obj.timer=0;
    obj.graceTimer=.65;
    obj.ownerNoHitTimer=.65;
    obj.state='placed';
    if(item==='BOUNCER' && Number.isFinite(obj.initialBounces)){
      obj.bounces=Math.max(1,obj.initialBounces-1);
    }
    if(kart.player && game?.currentItem===item)game.currentItem=null;
    if(kart.player)raceState.messages.push({text:'DROP '+item,t:.45});
    clearHeldStateV85(kart,false);
    return true;
  }

  const updatePlayerKartBaseV85=updatePlayerKart;
  updatePlayerKart=function(kart,inputState,track,dt){
    if(kart?.heldItemObjectV85 && !kart.heldItemObjectV85.active){
      clearHeldStateV85(kart,true);
    }

    const pressed=!!(inputState.itemPressed||inputState.itemQueued);
    const held=!!inputState.item;
    const current=kart?.player?game?.currentItem:kart?.item;

    if(pressed && !kart.heldItemObjectV85 && HOLDABLE_ITEMS_V85.has(current)){
      if(beginHeldItemV85(kart,current,game)){
        inputState.itemPressed=false;
        inputState.itemQueued=false;
      }
    }

    if(kart?.heldItemObjectV85){
      syncHeldObjectV85(kart.heldItemObjectV85,game);
      if(!held && kart.itemButtonWasDownV85){
        releaseHeldItemV85(kart,game);
      }else{
        kart.itemButtonWasDownV85=held;
      }
      inputState.itemPressed=false;
      inputState.itemQueued=false;
    }

    return updatePlayerKartBaseV85(kart,inputState,track,dt);
  };

  const startRaceBaseV85=startRace;
  startRace=function(asGP){
    const out=startRaceBaseV85(asGP);
    const player=playerKartV85();
    if(player)clearHeldStateV85(player,false);
    return out;
  };

  const renderTitleBaseV85=renderTitle;
  renderTitle=function(){
    renderTitleBaseV85();
    try{
      const note=menu.querySelector('[data-statelens-v78]');
      if(note)note.textContent='v85: fixed race counters, faster red seeker, severe off-road slowdown, and hold-to-drop green/dropper items.';
    }catch(_){}
  };

  window.DriftlineV85={
    version:'v85',
    seekerSpeed:()=>typeof SEEKER_CONFIG_V22!=='undefined'?SEEKER_CONFIG_V22.speed:null,
    offroad:SURFACE_MODIFIERS.offroad,
    holdableItems:[...HOLDABLE_ITEMS_V85]
  };
})();

/* === V84 ANIMATED BOOT + PROVENANCE DISCOVERY ===
   - Loader is present in first HTML paint, so a slow mobile boot never looks frozen.
   - Procedural tracks are constructed one per animation frame to keep the dots alive.
   - The title-screen version note links directly to the public provenance archive.
*/
(function(){
  const loader=document.getElementById('bootLoader');
  const loaderStarted=performance.now();
  let bootFinished=false;

  function closeLoaderV84(){
    if(!loader)return;
    const minimumVisibleMs=720;
    const remaining=Math.max(0,minimumVisibleMs-(performance.now()-loaderStarted));
    setTimeout(()=>{
      loader.classList.add('done');
      setTimeout(()=>loader.remove(),280);
    },remaining);
  }

  function finishBootV84(){
    if(bootFinished)return;
    bootFinished=true;
    try{
      for(const tr of tracks)attachCpuOvertakePathsV55(tr);
      if(typeof buildAllTracks.applyMasterTrack1AiV62==='function'){
        buildAllTracks.applyMasterTrack1AiV62();
      }
      bindInput();
      renderTitle();
      requestAnimationFrame(frame);
      requestAnimationFrame(closeLoaderV84);
      window.DriftlineV84={
        version:'v84',
        loading:'animated-three-dot chunked boot',
        provenance:'https://aiprojectfiles.com/gpt-mode-7-kart-racer/provenance/'
      };
    }catch(error){
      console.error('Driftline GP v84 boot finalization failed',error);
      if(loader){
        const word=loader.querySelector('.bootLoaderWord');
        if(word)word.textContent='LOAD ERROR';
      }
    }
  }

  function buildNextTrackV84(index){
    try{
      if(index===0)tracks=[];
      if(index<trackDefs.length){
        tracks[index]=buildTrack(trackDefs[index],index);
        requestAnimationFrame(()=>buildNextTrackV84(index+1));
        return;
      }
      finishBootV84();
    }catch(error){
      console.error('Driftline GP v84 track construction failed',error);
      if(loader){
        const word=loader.querySelector('.bootLoaderWord');
        if(word)word.textContent='LOAD ERROR';
      }
    }
  }

  /* Two frames guarantee the loader is painted before construction begins. */
  requestAnimationFrame(()=>requestAnimationFrame(()=>buildNextTrackV84(0)));
})();


/* === V86 HELD ITEM VISUAL FEEDBACK ===
   - When the player holds ITEM with BOUNCER or DROPPER, the held object is now
     visibly attached behind the kart in the main race view.
   - Releasing still drops the object onto the road using the existing v85 logic.
*/
(function(){
  function heldItemNameV86(kart){
    if(!kart) return null;
    if(kart.heldItemTypeV85) return kart.heldItemTypeV85;
    const obj=kart.heldItemObjectV85;
    if(!obj||!obj.active) return null;
    if(obj.type===OBJECT_TYPES.BOUNCER) return 'BOUNCER';
    if(obj.type===OBJECT_TYPES.DROPPER) return 'DROPPER';
    return null;
  }

  function heldAnchorV86(frame){
    const base=String(frame||'back').replace('drift_','');
    let x=0,y=15;
    if(base.includes('left')) x=6;
    else if(base.includes('right')) x=-6;
    if(base.startsWith('front')) y=12;
    if(base==='left'||base==='right') y=13;
    return {x,y};
  }

  function drawHeldBouncerV86(x,y,bob){
    ctx.save();
    ctx.translate(x,y+bob);
    ctx.fillStyle='rgba(0,0,0,.26)';
    ctx.fillRect(-7,3,14,3);
    ctx.strokeStyle='rgba(255,255,255,.28)';
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(0,-12);
    ctx.lineTo(0,-3);
    ctx.stroke();
    ctx.fillStyle='#6dff72';
    ctx.beginPath();
    ctx.arc(0,0,6.5,0,TAU);
    ctx.fill();
    ctx.strokeStyle='#ecfff0';
    ctx.lineWidth=1;
    ctx.stroke();
    ctx.fillStyle='#ecfff0';
    ctx.fillRect(-2,-1,5,2);
    ctx.fillStyle='#4adf5a';
    ctx.beginPath();
    ctx.moveTo(5,-1);
    ctx.lineTo(10,0);
    ctx.lineTo(5,2);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawHeldDropperV86(x,y,bob){
    ctx.save();
    ctx.translate(x,y+bob);
    ctx.fillStyle='rgba(0,0,0,.26)';
    ctx.fillRect(-8,3,16,3);
    ctx.strokeStyle='rgba(255,255,255,.28)';
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(0,-12);
    ctx.lineTo(0,-3);
    ctx.stroke();
    ctx.rotate(-0.14);
    ctx.fillStyle='#ffe56b';
    ctx.beginPath();
    ctx.moveTo(-7,-2);
    ctx.quadraticCurveTo(-1,-9,7,-2);
    ctx.quadraticCurveTo(1,4,-7,-2);
    ctx.fill();
    ctx.fillStyle='#9a6b1d';
    ctx.fillRect(4,-7,2,3);
    ctx.restore();
  }

  function drawHeldVisualV86(item,frame){
    const a=heldAnchorV86(frame);
    const bob=Math.sin((game?.elapsed||0)*10)*0.35;
    if(item==='BOUNCER') drawHeldBouncerV86(a.x,a.y,bob);
    else if(item==='DROPPER') drawHeldDropperV86(a.x,a.y,bob);
  }

  const baseDrawPlayerKartV86 = drawPlayerKart;
  drawPlayerKart = function(x,y,racer,sc=1,steer=0,boost=0,victory=false,aura=0,tiny=0,frame='back',kart=null){
    if(kart && kart.heldItemObjectV85 && kart.heldItemObjectV85.active){
      const heldItem = heldItemNameV86(kart);
      if(heldItem){
        ctx.save();
        ctx.translate(x,y);
        ctx.scale(sc,sc);
        if(steer)ctx.rotate(steer*.05);
        if(tiny>0)ctx.scale(.82,.82);
        if(kart&&kart.status==='flatten')ctx.scale(1,.42);
        const driftFrame=String(frame).indexOf('drift_')===0;
        const baseFrame=String(frame).replace('drift_','');
        const side=baseFrame==='left'||baseFrame==='right';
        const lean=(baseFrame.includes('left')?-1:baseFrame.includes('right')?1:0);
        if(side)ctx.scale(.74,1);
        if(lean)ctx.translate(lean*(driftFrame?5:2),0);
        if(driftFrame)ctx.rotate(lean*.10);
        drawHeldVisualV86(heldItem,frame);
        ctx.restore();
      }
    }
    return baseDrawPlayerKartV86.apply(this, arguments);
  };

  const renderTitleBaseV86=renderTitle;
  renderTitle=function(){
    renderTitleBaseV86();
    try{
      const note=menu.querySelector('[data-statelens-v78]');
      if(note)note.textContent='v86: held green and yellow items now visibly stick behind the kart before you release them.';
    }catch(_){ }
  };

  window.DriftlineV86={
    version:'v86',
    visuals:'held bouncer/dropper visibly attached behind kart before release'
  };
})();

})();
</script>
