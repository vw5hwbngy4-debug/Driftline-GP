function drawDropper(x,y,s){const sz=clamp(20*s,6,24);ctx.fillStyle='#221325';ctx.fillRect(x-sz/2,y-sz*.55,sz,sz*.6);ctx.fillStyle='#d36dff';ctx.fillRect(x-sz*.25,y-sz*.45,sz*.5,sz*.3);}
function drawSpark(x,y,s){const sz=clamp(22*s,5,24);ctx.fillStyle='#fff47d';ctx.beginPath();ctx.moveTo(x+sz*.6,y);ctx.lineTo(x-sz*.2,y-sz*.22);ctx.lineTo(x-sz*.6,y);ctx.lineTo(x-sz*.2,y+sz*.22);ctx.fill();ctx.fillStyle='#61e4ff';ctx.fillRect(x-sz*.1,y-1,sz*.3,2);}
function drawRival(r,p){const sc=clamp(p.scale*.70,.12,1.06);drawPlayerKart(p.x,p.y,r.stats,sc,0,r.boost,r.finished);if(r.shield>0){ctx.strokeStyle='#80ffe8';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y-17*sc,22*sc,0,TAU);ctx.stroke();}if(r.stun>0){pixelText('!',p.x-3,p.y-42*sc,1,'#ffef67','#000');}}
function drawPlayerKart(x,y,racer,sc=1,steer=0,boost=0,victory=false){
  ctx.save();ctx.translate(x,y);ctx.scale(sc,sc); if(steer)ctx.rotate(steer*.05);
  ctx.fillStyle='rgba(0,0,0,.38)';ctx.fillRect(-20,4,40,7);
  if(boost>0){ctx.fillStyle='#ffd45a';ctx.fillRect(-9,14,6,12);ctx.fillRect(4,14,6,12);}
  ctx.fillStyle='#101018';ctx.fillRect(-19,-2,8,12);ctx.fillRect(11,-2,8,12);
  ctx.fillStyle=racer.color;ctx.fillRect(-14,-14,28,18);ctx.fillRect(-10,-22,20,12);ctx.fillStyle=racer.accent;ctx.fillRect(-8,-19,16,5);ctx.fillRect(-12,-9,24,4);
  ctx.fillStyle='#fff5d7';ctx.fillRect(-7,-31,14,10);ctx.fillStyle='#111';ctx.fillRect(-4,-27,2,2);ctx.fillRect(4,-27,2,2);ctx.fillStyle=racer.color;ctx.fillRect(-10,-36,20,6);ctx.fillRect(-12,-34,24,4);
  ctx.fillStyle='#f5fbff';ctx.fillRect(-13,-14,5,4);ctx.fillRect(8,-14,5,4);if(victory){const bob=Math.sin(game.elapsed*12)>0?1:0;ctx.fillStyle='#fff5d7';ctx.fillRect(-17,-30-bob,5,3);ctx.fillRect(12,-30-bob,5,3);ctx.fillStyle=racer.accent;ctx.fillRect(-19,-27-bob,7,3);ctx.fillRect(12,-27-bob,7,3);}ctx.restore();
}
function renderHUD(){
  const p=game.racers[0];
  ctx.fillStyle='rgba(5,8,18,.62)';ctx.fillRect(0,0,W,34);ctx.fillRect(0,H-24,W,24);
  pixelText(ordinal(game.rank),8,8,1,'#fff3a0','#000');pixelText('LAP '+clamp(p.lap+1,1,lapsToRun)+'/games/driftline-gp/'+lapsToRun,54,8,1,'#fff','#000');pixelText(fmtTime(game.time),232,8,1,'#fff','#000');
  drawItemPanel();
  drawMinimap(W-70,39,62,62);
  if(game.waitGas){bigCenter('PUSH STICK',114,'#fff3a0'); pixelText('stick = gas  down = brake',75,142,1,'#fff','#000');}
  else if(game.countdown>0){let t=game.countdown;let txt=t>2.35?'3':t>1.35?'2':t>.35?'1':'GO';bigCenter(txt,108,txt==='GO'?'#7dff9a':'#fff3a0');}
  for(let i=0;i<game.messages.length;i++){const m=game.messages[i]; if(!m.text)continue; bigCenter(m.text,64+i*22,m.text==='FINAL LAP'?'#ffef67':'#ffffff',1);}
  if(game.finished&&game.raceEndTimer>0){bigCenter('FINISH',104,'#fff3a0');pixelText('rivals still racing...',92,128,1,'#ffffff','#000');}
  if(p.shield>0){ctx.strokeStyle='#80ffe8';ctx.lineWidth=2;ctx.beginPath();ctx.arc(W/2,H-48,28,0,TAU);ctx.stroke();}
}
function itemShort(name){return {BOOST:'BST',SPARK:'SPK',SHIELD:'SHD',DROPPER:'DRP',WAVE:'WAV'}[name]||'---';}
function itemColor(name){return {BOOST:'#ffd45a',SPARK:'#61e4ff',SHIELD:'#80ffe8',DROPPER:'#d36dff',WAVE:'#ff8bd6'}[name]||'#aab3d4';}
function drawItemPanel(){
  const x=110,y=3,w=100,h=28;
  ctx.fillStyle='rgba(7,13,29,.88)';ctx.fillRect(x,y,w,h);ctx.strokeStyle=game.itemFlash>0?'#ffd45a':'rgba(255,255,255,.35)';ctx.strokeRect(x+.5,y+.5,w-1,h-1);
  if(game.roulette){
    const center=game.rouletteItem||'BOOST';
    const locked=game.roulette.locked;
    const visible=!locked || (Math.floor((.44-game.roulette.t)/.11)%2===0);
    for(let i=-2;i<=2;i++){const name=itemNames[wrap((game.roulette.index+i),itemNames.length)];const bx=x+8+(i+2)*17;ctx.fillStyle=(i===0&&visible)?itemColor(center):'rgba(255,255,255,.16)';ctx.fillRect(bx,y+5,14,14);ctx.fillStyle='#07101d';ctx.fillRect(bx+3,y+8,8,8);}
    pixelText(visible?itemShort(center):'...',x+38,y+18,1,'#fff3a0','#000');
  }else{
    const name=game.currentItem||'NO ITEM';
    if(game.currentItem){ctx.fillStyle=itemColor(game.currentItem);ctx.fillRect(x+6,y+7,15,15);ctx.fillStyle='#07101d';ctx.fillRect(x+10,y+11,7,7);}
    pixelText(game.currentItem?itemShort(name):'NO ITEM',x+(game.currentItem?28:29),y+10,1,game.currentItem?'#ffd45a':'#aab3d4','#000');
  }
}
function drawMinimap(x,y,w,h){
  const tr=game.track;ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(x-3,y-3,w+6,h+6);ctx.drawImage(tr.mapCanvas,x,y,w,h);ctx.strokeStyle='#fff';ctx.strokeRect(x,y,w,h);
  for(const r of game.racers){const px=x+r.x/WORLD*w,py=y+r.y/WORLD*h;ctx.fillStyle=r.player?'#fff35a':r.stats.color;ctx.fillRect(px-1.5,py-1.5,3,3);}
}
function bigCenter(text,y,color='#fff',scale=2){const width=text.length*6*scale;pixelText(text,(W-width)/2,y,scale,color,'#000');}
function pixelText(text,x,y,scale=1,color='#fff',shadow='#000'){
  x=Math.round(x);y=Math.round(y);ctx.save();ctx.font=(8*scale)+'px monospace';ctx.textBaseline='top';ctx.imageSmoothingEnabled=false;if(shadow){ctx.fillStyle=shadow;ctx.fillText(text,x+scale,y+scale);}ctx.fillStyle=color;ctx.fillText(text,x,y);ctx.restore();
}

function bindInput(){
  input=makeInput();
  window.addEventListener('keydown',e=>{if(!input)return;input.keys[e.key.toLowerCase()]=true;if(e.key===' '){input.item=true;input.itemPressed=true;e.preventDefault();}if(e.key==='Shift'||e.key.toLowerCase()==='x'){input.jump=true;input.jumpPressed=true;e.preventDefault();}});
  window.addEventListener('keyup',e=>{if(!input)return;input.keys[e.key.toLowerCase()]=false;if(e.key===' ')input.item=false;if(e.key==='Shift'||e.key.toLowerCase()==='x')input.jump=false;});
  const ptrPos=e=>({x:e.clientX,y:e.clientY});
  stick.addEventListener('pointerdown',e=>{if(!input)return;stick.setPointerCapture(e.pointerId);input.stickId=e.pointerId;const r=stick.getBoundingClientRect();input.stickCenter={x:r.left+r.width/2,y:r.top+r.height/2};handleStick(e);e.preventDefault();});
  stick.addEventListener('pointermove',e=>{if(input&&input.stickId===e.pointerId){handleStick(e);e.preventDefault();}});
  const endStick=e=>{if(input&&input.stickId===e.pointerId){input.stickId=null;input.touch.steer=0;input.touch.gas=false;input.touch.brake=false;input.steer=0;knob.style.transform='translate(0,0)';}};
  stick.addEventListener('pointerup',endStick);stick.addEventListener('pointercancel',endStick);
  function handleStick(e){const p=ptrPos(e),c=input.stickCenter;const dx=p.x-c.x,dy=p.y-c.y;const max=42;const len=Math.hypot(dx,dy)||1;const nx=dx/Math.max(len,max)*Math.min(len,max);const ny=dy/Math.max(len,max)*Math.min(len,max);knob.style.transform='translate('+nx+'px,'+ny+'px)';input.touch.steer=clamp(dx/max,-1,1);input.touch.gas=dy<22;input.touch.brake=dy>32;}
  bindButton(btnGas,'gas'); bindButton(btnItem,'item'); bindButton(btnJump,'jump');
  function bindButton(elm,name){
    elm.addEventListener('pointerdown',e=>{if(!input)return;elm.setPointerCapture(e.pointerId);input.touch[name]=true; input[name]=true; if(name==='item')input.itemPressed=true;if(name==='jump')input.jumpPressed=true;elm.classList.add('down');e.preventDefault();});
    const up=e=>{if(!input)return;input.touch[name]=false; input[name]=false;elm.classList.remove('down');e.preventDefault();};
    elm.addEventListener('pointerup',up);elm.addEventListener('pointercancel',up);elm.addEventListener('pointerleave',e=>{if(e.buttons===0)up(e);});
  }
}
function pollKeyboard(){if(!input)return;const k=input.keys;const left=k.arrowleft||k.a, right=k.arrowright||k.d, up=k.arrowup||k.w, down=k.arrowdown||k.s;const keySteer=(left?-1:0)+(right?1:0);input.steer=input.stickId!==null?input.touch.steer:keySteer;input.gas=!!(input.touch.gas||up);input.brake=!!(input.touch.brake||down);input.item=!!input.touch.item;input.jump=!!input.touch.jump;}
function frame(now){let dt=Math.min((now-last)/1000,.05);last=now; pollKeyboard(); update(dt); render(); requestAnimationFrame(frame);}

function boot(){buildAllTracks();bindInput();renderTitle();requestAnimationFrame(frame);}
boot();
})();
