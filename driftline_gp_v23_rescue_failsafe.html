    const score=d*(1.35-dot);
    if(score<bestScore){bestScore=score;best=r;}

}
function findTargetAhead(owner,raceState){
  const cone=findTargetInFrontConeV22(owner,raceState);
  if(cone)return cone;
  if(!owner||!raceState?.racers)return null;
  const ownerProgress=seekerProgressOfV22(owner);
  const candidates=[];
  for(const r of raceState.racers){
    if(!seekerValidTargetV22(owner,r))continue;
    let delta=seekerProgressOfV22(r)-ownerProgress;
    if(delta<0)delta+=100000*lapsToRun;
    if(delta>4)candidates.push({r,delta,d2:squaredDistance(owner.x,owner.y,r.x,r.y)});
  }
  candidates.sort((a,b)=>a.delta-b.delta||a.d2-b.d2);
  if(candidates.length)return candidates[0].r;
  const fallback=[];
  for(const r of raceState.racers){
    if(!seekerValidTargetV22(owner,r))continue;
    fallback.push({r,d2:squaredDistance(owner.x,owner.y,r.x,r.y)});
  }
  fallback.sort((a,b)=>a.d2-b.d2);
  return fallback[0]?.r||null;
}
function fireSeeker(kart,raceState){
  if(!kart||!raceState)return null;
  const angle=kart.faceAngle??kart.angle??0;
  const c=safeCosV17(angle), s=safeSinV17(angle);
  const target=findTargetAhead(kart,raceState);
  const distToTarget=target ? (Math.abs(target.x-kart.x)+Math.abs(target.y-kart.y)) : 99999;
  const mode=target && distToTarget<SEEKER_CONFIG_V22.lockManhattan ? 'HOMING' : 'NODE_FOLLOW';
  return spawnObject(OBJECT_TYPES.SEEKER,{
    ownerId:kart.id,
    targetId:target?target.id:null,
    bridgeZone:kart.bridgeZone??0,
    x:kart.x+c*SEEKER_CONFIG_V22.spawnDistance,
    y:kart.y+s*SEEKER_CONFIG_V22.spawnDistance,
    vx:c*SEEKER_CONFIG_V22.speed,
    vy:s*SEEKER_CONFIG_V22.speed,
    angle,
    speed:SEEKER_CONFIG_V22.speed,
    life:SEEKER_CONFIG_V22.life,
    nodeIndex:kart.nextNodeIndex??((kart.currentNodeIndex??0)+2)%raceState.track.nodes.length,
    mode,
    state:mode==='HOMING'?'homing':'node',
    radius:SEEKER_CONFIG_V22.radiusX,
    radiusX:mode==='HOMING'?SEEKER_CONFIG_V22.homingRadiusX:SEEKER_CONFIG_V22.radiusX,
    radiusY:mode==='HOMING'?SEEKER_CONFIG_V22.homingRadiusY:SEEKER_CONFIG_V22.radiusY,
    graceTimer:SEEKER_CONFIG_V22.ownerGrace,
    ownerNoHitTimer:SEEKER_CONFIG_V22.ownerGrace,
    retargetTimer:0.05
  });
}
function isTargetInsideSeekerLockRadius(obj,target){
  if(!obj||!target)return false;
  const man=Math.abs(target.x-obj.x)+Math.abs(target.y-obj.y);
  if(man<SEEKER_CONFIG_V22.lockManhattan)return true;
  const dotTarget=(()=>{
    const dx=target.x-obj.x, dy=target.y-obj.y, d=Math.hypot(dx,dy)||1;
    return (dx*safeCosV17(obj.angle||0)+dy*safeSinV17(obj.angle||0))/d;
  })();
  return man<SEEKER_CONFIG_V22.lockManhattan*1.18 && dotTarget>0.10;
}
function updateSeekerNodeFollow(obj,raceState,dt){
  const track=raceState.track, node=track.nodes?.[obj.nodeIndex||0];
  if(!node){despawnObject(obj);return;}
  const desired=angleTo(obj.x,obj.y,node.x,node.y);
  obj.angle=lerpAngle(obj.angle,desired,SEEKER_CONFIG_V22.nodeTurnRate*dt);
  obj.vx=safeCosV17(obj.angle)*obj.speed;
  obj.vy=safeSinV17(obj.angle)*obj.speed;
  if(squaredDistance(obj.x,obj.y,node.x,node.y)<SEEKER_CONFIG_V22.nodeReachRadius*SEEKER_CONFIG_V22.nodeReachRadius){
    obj.nodeIndex=((obj.nodeIndex||0)+1)%track.nodes.length;
  }
}
function updateSeekerHoming(obj,target,raceState,dt){
  const lead=Math.min(.22,Math.max(.06,(Math.abs(target.x-obj.x)+Math.abs(target.y-obj.y))/4200));
  const tx=target.x+safeCosV17(target.moveAngle??target.faceAngle??target.angle??0)*(target.speed||0)*lead;
  const ty=target.y+safeSinV17(target.moveAngle??target.faceAngle??target.angle??0)*(target.speed||0)*lead;
  const desired=angleTo(obj.x,obj.y,tx,ty);
  const man=Math.abs(target.x-obj.x)+Math.abs(target.y-obj.y);
  const turn=man<SEEKER_CONFIG_V22.closeManhattan?SEEKER_CONFIG_V22.closeHomingTurnRate:SEEKER_CONFIG_V22.homingTurnRate;
  obj.angle=lerpAngle(obj.angle,desired,turn*dt);
  obj.speed=Math.max(obj.speed||0,SEEKER_CONFIG_V22.speed);
  obj.vx=safeCosV17(obj.angle)*obj.speed;
  obj.vy=safeSinV17(obj.angle)*obj.speed;
  obj.radiusX=SEEKER_CONFIG_V22.homingRadiusX;
  obj.radiusY=SEEKER_CONFIG_V22.homingRadiusY;
}
function updateSeekerWithoutTarget(obj,raceState,dt){
  obj.retargetTimer=(obj.retargetTimer||0)-dt;
  if(obj.retargetTimer<=0){
    obj.retargetTimer=SEEKER_CONFIG_V22.retargetTime;
    const owner=getRacerById(raceState,obj.ownerId);
    const t=owner?findTargetAhead(owner,raceState):null;
    if(t){obj.targetId=t.id;obj.mode='HOMING';obj.state='homing';updateSeekerHoming(obj,t,raceState,dt);return;}
  }
  obj.mode='NODE_FOLLOW';obj.state='node';obj.radiusX=SEEKER_CONFIG_V22.radiusX;obj.radiusY=SEEKER_CONFIG_V22.radiusY;
  updateSeekerNodeFollow(obj,raceState,dt);
}
function updateSeeker(obj,raceState,dt){
  let target=getRacerById(raceState,obj.targetId);
  const owner=getRacerById(raceState,obj.ownerId);
  if(!target||target.finished||String(target.status||'').startsWith('rescue')||((obj.bridgeZone??0)!==(target.bridgeZone??0))){
    const fresh=owner?findTargetAhead(owner,raceState):null;
    if(fresh){obj.targetId=fresh.id;target=fresh;}
  }
  if(!target||target.finished||String(target.status||'').startsWith('rescue')||((obj.bridgeZone??0)!==(target.bridgeZone??0))){
    updateSeekerWithoutTarget(obj,raceState,dt);
  }else if(isTargetInsideSeekerLockRadius(obj,target)||obj.mode==='HOMING'){
    obj.mode='HOMING';obj.state='homing';
    updateSeekerHoming(obj,target,raceState,dt);
  }else{
    obj.mode='NODE_FOLLOW';obj.state='node';obj.radiusX=SEEKER_CONFIG_V22.radiusX;obj.radiusY=SEEKER_CONFIG_V22.radiusY;
    updateSeekerNodeFollow(obj,raceState,dt);
  }
  obj.x+=obj.vx*dt;obj.y+=obj.vy*dt;
  // In HOMING mode, do not instantly vanish on a soft track edge; give it a chance to finish the attack.
  const wall=sampleWallCollision(raceState.track,obj.x,obj.y);
  if(wall && obj.mode!=='HOMING'){
    spawnPoof(obj.x,obj.y,raceState);despawnObject(obj);return;
  }
  if(wall && obj.mode==='HOMING'){
    obj.life-=dt*.8;
    obj.x-=obj.vx*dt*.35; obj.y-=obj.vy*dt*.35;
  }
}


/* === V23 RESCUE FAILSAFE PATCH ===
   Fixes ghost/void rescue loops: rescue target must be a safe centerline node,
   landing gets a short safe grace window, and rescue never re-targets into void/gap/lava/deep. */
function isRescueBadSurfaceV23(surface){
  return surface===SURFACE.VOID||surface===SURFACE.GAP||surface===SURFACE.LAVA||surface===SURFACE.DEEP||surface===SURFACE.DEEP_WATER||surface==='void'||surface==='gap'||surface==='deep_water';
}
function isSafeRescuePointV23(track,x,y){
  if(!Number.isFinite(x)||!Number.isFinite(y))return false;
  if(x<42||y<42||x>WORLD-42||y>WORLD-42)return false;
  const s=sampleSurface(track,x,y);
  return !isRescueBadSurfaceV23(s);
}
function rescuePointFromS_V23(track,s){
  const p=pointAt(track,wrap(s||0,track.len||1),0);
  return {x:p.x,y:p.y,angle:p.angle,s:p.s};
}
function findSafeRescueTargetV23(track,kart){
  const starts=[];
  if(Number.isFinite(kart.lastSafeS))starts.push(kart.lastSafeS);
  if(track.nodes&&Number.isFinite(kart.lastSafeNodeIndex)&&track.nodes[kart.lastSafeNodeIndex])starts.push(track.nodes[kart.lastSafeNodeIndex].s);
  if(Number.isFinite(kart.s))starts.push(kart.s);
  if(track.nodes&&Number.isFinite(kart.currentNodeIndex)&&track.nodes[kart.currentNodeIndex])starts.push(track.nodes[kart.currentNodeIndex].s);
  starts.push(0);
  const len=track.len||1;
  for(const base of starts){
    const p=rescuePointFromS_V23(track,base);
    if(isSafeRescuePointV23(track,p.x,p.y))return p;
  }
  const base=starts.find(Number.isFinite)??0;
  const step=len/96;
  for(let i=1;i<=96;i++){
    const p1=rescuePointFromS_V23(track,base-step*i);
    if(isSafeRescuePointV23(track,p1.x,p1.y))return p1;
    const p2=rescuePointFromS_V23(track,base+step*i);
    if(isSafeRescuePointV23(track,p2.x,p2.y))return p2;
  }
  // Last-resort: use start line and explicitly mark it as a safe landing.
  const p0=rescuePointFromS_V23(track,0);
  p0.forceSafe=true;
  return p0;
}
function snapKartToSafeRescueTargetV23(kart,track){
  const t=findSafeRescueTargetV23(track,kart);
  kart.x=t.x; kart.y=t.y; kart.faceAngle=t.angle; kart.moveAngle=t.angle; kart.angle=t.angle;
  kart.s=t.s||0; kart.lastSafeS=t.s||0;
  kart.currentNodeIndex=nearestNodeIndex(track,kart.s); kart.lastSafeNodeIndex=kart.currentNodeIndex; kart.nextNodeIndex=(kart.currentNodeIndex+1)%track.nodes.length;
  return t;
}
function startRescue(kart,track,reason){
  if(!kart||!track)return;
  if(kart.status&&String(kart.status).startsWith('rescue'))return;
  kart.status='rescue_lift';
  kart.rescuePhase='lift';
  kart.inputLocked=true;
  kart.speed=0;
  kart.rescueReason=reason;
  kart.rescueTimer=0;
  kart.zVel=0;
  kart.grounded=false;
  kart.drifting=false;
  kart.moveAngle=kart.faceAngle??kart.angle??0;
  if(!kart._rescueCoinLock){loseCoins(kart,2,false);kart._rescueCoinLock=true;}
  const safe=findSafeRescueTargetV23(track,kart);
  kart.rescueTarget={x:safe.x,y:safe.y,angle:safe.angle,s:safe.s,index:nearestNodeIndex(track,safe.s||0),forceSafe:!!safe.forceSafe};
  if(kart.player&&game?.messages)game.messages.push({text:'RESCUE',t:.9});
}
function updateRescue(kart,dt){
  if(!kart.status||!String(kart.status).startsWith('rescue'))return;
  const track=game.track;
  if(!kart.rescueTarget||!Number.isFinite(kart.rescueTarget.x)||!Number.isFinite(kart.rescueTarget.y)){
    const safe=findSafeRescueTargetV23(track,kart);
    kart.rescueTarget={x:safe.x,y:safe.y,angle:safe.angle,s:safe.s,index:nearestNodeIndex(track,safe.s||0)};
  }
  kart.rescueTimer+=dt;
  const t=kart.rescueTarget;
  if(kart.status==='rescue_lift'){
    kart.z=lerp(kart.z||0,3.2,.08);
    if(kart.rescueTimer>.45){kart.status='rescue_carry';kart.rescueTimer=0;}
    return;
  }
  if(kart.status==='rescue_carry'){
    kart.x=lerp(kart.x,t.x,.070);kart.y=lerp(kart.y,t.y,.070);
    kart.faceAngle=lerpAngle(kart.faceAngle??t.angle,t.angle,.09);kart.moveAngle=kart.faceAngle;kart.angle=kart.faceAngle;
    if(distance(kart.x,kart.y,t.x,t.y)<28||kart.rescueTimer>1.65){
      kart.x=t.x; kart.y=t.y; kart.faceAngle=t.angle; kart.moveAngle=t.angle; kart.angle=t.angle;
      kart.s=t.s||kart.s||0; kart.lastSafeS=kart.s; kart.currentNodeIndex=nearestNodeIndex(track,kart.s); kart.lastSafeNodeIndex=kart.currentNodeIndex; kart.nextNodeIndex=(kart.currentNodeIndex+1)%track.nodes.length;
      kart.status='rescue_drop';kart.rescueTimer=0;
    }
    return;
  }
  if(kart.status==='rescue_drop'){
    kart.z=lerp(kart.z||0,0,.11);
    if(kart.z<.05||kart.rescueTimer>.9){
      kart.z=0; kart.grounded=true;
      // Validate landing. If somehow the chosen node became unsafe, snap to another safe point immediately.
      if(!isSafeRescuePointV23(track,kart.x,kart.y)){
        const safe=snapKartToSafeRescueTargetV23(kart,track);
        kart.rescueTarget={x:safe.x,y:safe.y,angle:safe.angle,s:safe.s,index:nearestNodeIndex(track,safe.s||0),forceSafe:!!safe.forceSafe};
      }
      kart.status='rescue_land';kart.rescueTimer=0;kart.landingBoostWindow=.22;kart.rescueGrace=1.4;kart.damageCooldown=Math.max(kart.damageCooldown||0,1.1);
    }
    return;
  }
  if(kart.status==='rescue_land')updateRescueLandingBoost(kart,dt);
}
function updateRescueLandingBoost(kart,dt){
  kart.landingBoostWindow=(kart.landingBoostWindow||0)-dt;
  const release=()=>{kart.status='normal';kart.inputLocked=false;kart.grounded=true;kart.z=0;kart.zVel=0;kart._rescueCoinLock=false;kart.rescueGrace=1.25;kart.damageCooldown=Math.max(kart.damageCooldown||0,1.0);};
  if(kart.player){
    if(input.gas&&kart.landingBoostWindow>0){kart.speed=Math.max(kart.speed,kart.stats.max*.72);kart.boost=.42;kart.offroadBypassTimer=.75;release();if(game?.messages)game.messages.push({text:'BOOST LANDING',t:.8});return;}
    if(kart.landingBoostWindow<=0){kart.speed=input.gas?kart.stats.max*.22:0;release();return;}
  }else{kart.speed=kart.stats.max*.45;release();}
}
const updateKartTimersBaseV23=updateKartTimers;
function updateKartTimers(kart,dt){
  updateKartTimersBaseV23(kart,dt);
  kart.rescueGrace=Math.max(0,(kart.rescueGrace||0)-dt);
}
function safeTrackRecovery(r,dt){
  const tr=game.track; const near=nearestOnTrack(tr,r.x,r.y);
  if(near.dist<tr.width*.52&&!isRescueBadSurfaceV23(sampleSurface(tr,r.x,r.y))){
    r.lastSafeS=near.s; const ni=nearestNodeIndex(tr,near.s);r.lastSafeNodeIndex=ni;
  }
  if(String(r.status||'').startsWith('rescue')||(r.rescueGrace||0)>0)return;
  const familyBonus = tr.fam==='beach' ? .85 : (tr.fam==='ghost'||tr.fam==='rainbow'||tr.fam==='lava' ? .35 : .55);
  const rescueDist = tr.width*(3.05+familyBonus);
  const edgeMargin = tr.fam==='beach' ? 30 : 44;
  if(near.dist>rescueDist||r.x<edgeMargin||r.y<edgeMargin||r.x>WORLD-edgeMargin||r.y>WORLD-edgeMargin){
    startRescue(r,tr,'out_of_bounds');
  }
}
function applySurfaceState(kart,surface,stats,dt){
  const mod=getSurfaceModifierForKartV18(kart,surface);kart.surfaceType=surface;
  if(surface===SURFACE.BRIDGE)kart.bridgeZone=1; else if(surface===SURFACE.ROAD||surface===SURFACE.SAND||surface===SURFACE.WET_SAND||surface===SURFACE.SURF_FOAM||surface===SURFACE.SHALLOW_WATER||surface===SURFACE.ICE||surface===SURFACE.MUD||surface===SURFACE.OFFROAD)kart.bridgeZone=0;
  if(mod.boostPad)triggerBoostPadV18(kart);if(mod.launchPad)triggerLaunchPadV18(kart);
  if((kart.rescueGrace||0)>0&&(mod.rescue||mod.gap))return;
  if(mod.gap){if(kart.grounded&&kart.z<=0)startRescue(kart,game.track,surface);return;}
  if(mod.rescue){startRescue(kart,game.track,surface);return;}
  if(mod.splash)maybeSpawnWaterSplashV18(kart,surface);if(mod.breaksDrift&&kart.status==='drift'){kart.status='recover';kart.drifting=false;}
}
